<title>IFD Shop Operations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: an app shell. A sticky top bar carries the store light; tabs run across the top on a desktop
   and along the bottom on a phone. Lists read like fitting sheets, and bay codes are printed like rack labels. */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --sunk:#e8eae4; --ink:#14181a; --muted:#566065; --line:#d3d7cf;
  --brand:#14181a; --on-brand:#ffffff; --gold:#9a7226;
  --label:#ffd21f; --on-label:#14181a;
  --ok:#1b7340; --ok-bg:#dcf1e3; --warn:#7d5200; --warn-bg:#fcebbf; --bad:#b0241c; --bad-bg:#fadfdb; --info:#1b5683; --info-bg:#dbe9f6;
  --focus:#1b5683; --shade:rgba(20,24,26,.45); --paper:#ffffff; --pen:#14181a;
  --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101314; --surface:#1a1e20; --sunk:#141718; --ink:#edf0ee; --muted:#9aa4a7; --line:#2d3336;
  --brand:#edf0ee; --on-brand:#101314; --gold:#d6ab5c;
  --label:#ffd21f; --on-label:#14181a;
  --ok:#72d49a; --ok-bg:#133423; --warn:#f1c463; --warn-bg:#3a2c0a; --bad:#ff9f96; --bad-bg:#431a17; --info:#92c6ef; --info-bg:#14304a;
  --focus:#92c6ef; --shade:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101314; --surface:#1a1e20; --sunk:#141718; --ink:#edf0ee; --muted:#9aa4a7; --line:#2d3336;
  --brand:#edf0ee; --on-brand:#101314; --gold:#d6ab5c;
  --label:#ffd21f; --on-label:#14181a;
  --ok:#72d49a; --ok-bg:#133423; --warn:#f1c463; --warn-bg:#3a2c0a; --bad:#ff9f96; --bad-bg:#431a17; --info:#92c6ef; --info-bg:#14304a;
  --focus:#92c6ef; --shade:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px;font-family:var(--font-body);font-weight:700;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.grow{flex:1;min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.store{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 10px;min-height:32px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.store i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.store.ok{background:var(--ok-bg);color:var(--ok)} .store.ok i{background:var(--ok)}
.store.bad{background:var(--bad-bg);color:var(--bad)} .store.bad i{background:var(--bad)}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;max-width:1180px;margin:0 auto;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));overflow-x:auto}
.tab{appearance:none;border:0;background:none;cursor:pointer;padding:12px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .badge{font-size:12px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--bad-bg);color:var(--bad);text-align:center}
.tab.only-phone{display:none}

/* page */
#view{max-width:1180px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{display:flex;flex-direction:column;gap:8px}
.sec > h2{display:flex;align-items:baseline;gap:8px}
.sec > h2 span{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted)}

/* buttons and fields */
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:44px}
textarea.in{min-height:84px;resize:vertical}
.in.sm{min-height:36px;padding:5px 8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 8px;min-height:44px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.seg.sm button{min-height:34px;padding:4px 8px;font-size:13px}

/* chips and the rack label */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.bay{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.04em;padding:1px 7px;background:var(--label);color:var(--on-label);border-radius:3px;white-space:nowrap}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile b{font-family:var(--font-display);font-size:34px;line-height:1}
.tile span{font-weight:600}
.tile small{color:var(--muted);font-size:13px}
.tile.hot{border-color:var(--bad);background:var(--bad-bg)} .tile.hot b{color:var(--bad)}
.actnow h2{color:var(--bad)} .actnow .list{border:1.5px solid var(--bad)}
.row.act{background:var(--bad-bg);align-items:flex-start}
.row.act .why{margin:4px 0 2px;font-weight:600;overflow-wrap:anywhere}
.actnone{margin:0;color:var(--muted);font-size:13px} .actnone b{color:var(--ink);margin-right:6px}
.card.backcard{border-color:var(--bad);background:var(--bad-bg)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.static{cursor:default} .row.static:hover{background:none}
.dateblk{flex:none;width:52px;text-align:center;font-family:var(--font-display);line-height:1}
.dateblk b{display:block;font-size:26px} .dateblk small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dateblk.none b{font-size:15px;color:var(--warn)} .dateblk.late b{color:var(--bad)}
.row .who{font-weight:700;overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row .end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:2px}

.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;border:1.5px solid var(--line);background:var(--surface)}
.banner.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.banner.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.banner.info{border-color:var(--info);background:var(--info-bg);color:var(--info)}
.banner p{margin:0}

/* diary */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:120px;display:flex;flex-direction:column;min-width:0}
.day.today{border-color:var(--ink);border-width:2px}
.day > header{padding:7px 9px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:6px}
.day > header small{font-family:var(--font-body);font-weight:600;font-size:12px;color:var(--muted)}
.dj{appearance:none;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;width:100%}
.dj:first-of-type{border-top:0}
.dj:hover{background:var(--sunk)}
.dj b{overflow-wrap:anywhere}
.dj.pencil{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--sunk) 8px 16px)}
.dj .sub{font-size:12px;color:var(--muted)}

/* stock */
.stk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stk-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.figs{display:flex;gap:16px;flex-wrap:wrap}
.fig b{display:block;font-family:var(--font-display);font-size:26px;line-height:1}
.fig small{font-size:12px;color:var(--muted);font-weight:600}
.fig.low b{color:var(--bad)}

/* job sheet */
#sheet{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(680px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.panel-head{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}
.panel-body{flex:1;overflow-y:auto;padding-block:14px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card > h3{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.kv dt{color:var(--muted);font-size:13px} .kv dd{margin:0;overflow-wrap:anywhere;user-select:all}
.ln{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.ln:first-of-type{border-top:0;padding-top:0}
.ln-top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.ln-top b{overflow-wrap:anywhere}
.ln-top .num{white-space:nowrap}
.ticks{display:flex;gap:14px;flex-wrap:wrap}
.tick{display:inline-flex;gap:7px;align-items:center;font-weight:600;min-height:36px;cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--ok)}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}

/* dialogs and toast */
#modal{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dlg{background:var(--bg);border-radius:12px;width:min(640px,100%);display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line)}
.dlg.narrow{width:min(440px,100%)}
.dlg-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.results:empty{display:none}
.pick{appearance:none;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:9px 11px;cursor:pointer;min-height:44px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pick:first-child{border-top:0} .pick:hover{background:var(--sunk)}
.pick span{overflow-wrap:anywhere}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--brand);color:var(--on-brand);padding:10px 16px;border-radius:999px;font-weight:600;max-width:min(92vw,560px);text-align:center}
#toast.bad{background:var(--bad);color:#fff}
/* measurements and site checks */
.radios{display:flex;flex-direction:column;gap:2px}
.radio{display:flex;gap:9px;align-items:flex-start;padding:7px 6px;min-height:40px;cursor:pointer;border-radius:8px}
.radio:hover{background:var(--sunk)}
.radio input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.todo{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.guide{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.guide p{margin:0}
#checksCard p,.tight p{margin:0}
.card details summary{cursor:pointer;color:var(--muted);font-weight:600;min-height:32px;display:flex;align-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs:empty{display:none}
.thumb{appearance:none;border:1px solid var(--line);background:var(--sunk);border-radius:8px;width:72px;height:72px;padding:0;cursor:pointer;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.big-pic{max-width:100%;max-height:68vh;border-radius:8px;border:1px solid var(--line);background:var(--paper);align-self:center}
.pad{width:100%;aspect-ratio:4/3;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);touch-action:none;display:block;cursor:crosshair}
.dj.pre{box-shadow:inset 4px 0 0 var(--info)}
.fitter-mode nav.tabs,.fitter-mode #newSaleTop,.fitter-mode #newMeasureTop{display:none}
.fwrap{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.fday{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fday.today{border-color:var(--ink);border-width:2px}
.fday.off{background:var(--sunk)}
.fday > header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px}
.fday > header b{font-family:var(--font-display);font-size:19px;line-height:1.1}
.fday > header small{display:block;color:var(--bad);font-weight:600}
.fent{appearance:none;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:56px}
.fent:hover{background:var(--sunk)}
.fent b{font-size:16px;overflow-wrap:anywhere}
.fent .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.fnone{border-top:1px solid var(--line);padding:8px 10px;color:var(--muted);font-size:13px}
.day.off{background:var(--sunk)}
.dayoff{padding:8px 9px;color:var(--bad);display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.dayact{margin-top:auto;padding:7px 9px;border-top:1px solid var(--line)}
.rd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:6px}
.area-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:7px}
.dpick{display:flex;flex-direction:column;gap:8px;min-width:0}
.dhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dday{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 4px;min-height:84px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;text-align:center}
.dday:hover:not(:disabled){border-color:var(--ink)}
.dday .dw{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dday .dn{font-family:var(--font-display);font-size:26px;line-height:1}
.dday .ds{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.dday .ds.busy{color:var(--ink);font-weight:600}
.dday .da{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:1px 6px;margin-top:2px;overflow-wrap:anywhere}
.dday.today{border-style:dashed}
.dday.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.dday.on .dw,.dday.on .ds{color:var(--on-brand)}
.dday.off{background:var(--bad-bg);border-color:var(--bad)} .dday.off .ds{color:var(--bad);font-weight:700}
.dday:disabled{cursor:not-allowed;opacity:.55} .dday.off:disabled,.dday.on:disabled{opacity:.8}
.ddetail{margin:0}
.subh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation-duration:2.4s} }

@media (max-width: 760px){
  .dstrip{grid-template-columns:repeat(4,minmax(0,1fr))}
  h1{font-size:26px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .brand small{display:none}
  .sec > h2{flex-wrap:wrap}
  .row.static{flex-wrap:wrap}
  .row.static > .bar{width:100%}
  .row.static > .bar .btn{flex:1}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs-in{justify-content:space-around;overflow:visible;gap:0}
  .tab{flex:1;flex-direction:column;gap:2px;padding:8px 2px;font-size:12px;border-bottom:0;border-top:3px solid transparent;justify-content:center;position:relative}
  .tab.on{border-top-color:var(--ink)}

  /* "5m x 4.6m = 23m2, 2 doorways" as typed on the website. Anything that does not read as a size is left alone, never guessed. */
  function parseRoomSize(text){

const Q_INBOX = 'query OpsInbox{ shop{myshopifyDomain} orders(first:25, sortKey:CREATED_AT, reverse:true, query:"status:open AND fulfillment_status:unfulfilled"){ nodes{ id name createdAt displayFinancialStatus displayFulfillmentStatus cancelledAt tags email phone totalPriceSet{shopMoney{amount}} totalOutstandingSet{shopMoney{amount}} customer{id displayName} shippingAddress{name address1 address2 city zip phone} customAttributes{key value} lineItems(first:12){ nodes{ title variantTitle quantity variant{ id product{productType} } customAttributes{key value} } } } } }';

const Q_VARIANTS = 'query OpsVariants($ids:[ID!]!){ shop{myshopifyDomain} nodes(ids:$ids){ ... on ProductVariant{ ' + VARIANT_FIELDS + ' product{ ' + PRODUCT_FIELDS + ' } } } }';
const Q_CUSTOMERS = 'query OpsCustomers($q:String!){ shop{myshopifyDomain} customers(first:8, query:$q){ nodes{ id displayName numberOfOrders defaultEmailAddress{emailAddress} defaultPhoneNumber{phoneNumber} defaultAddress{address1 address2 city zip phone} } } }';
const Q_DRAFT = 'query OpsDraft($id:ID!){ shop{myshopifyDomain} draftOrder(id:$id){ id name status order{ id name displayFulfillmentStatus cancelledAt } } }';
const Q_ORDER = 'query OpsOrder($id:ID!){ shop{myshopifyDomain} order(id:$id){ id name displayFulfillmentStatus cancelledAt } }';
const Q_DRAFT_TAG = 'query OpsDraftByTag($q:String!){ shop{myshopifyDomain} draftOrders(first:2, query:$q){ nodes{ id name status } } }';
const M_DRAFT_CREATE = 'mutation OpsDraftCreate($input:DraftOrderInput!){ draftOrderCreate(input:$input){ draftOrder{ id name status } userErrors{ field message } } }';
const M_DRAFT_DELETE = 'mutation OpsDraftDelete($input:DraftOrderDeleteInput!){ draftOrderDelete(input:$input){ deletedId userErrors{ field message } } }';
const M_ADJUST = key => 'mutation OpsAdjust($input:InventoryAdjustQuantitiesInput!){ inventoryAdjustQuantities(input:$input) @idempotent(key:"' + key + '"){ inventoryAdjustmentGroup{ id } userErrors{ field message code } } }';
const M_SET = key => 'mutation OpsSet($input:InventorySetQuantitiesInput!){ inventorySetQuantities(input:$input) @idempotent(key:"' + key + '"){ inventoryAdjustmentGroup{ id } userErrors{ field message code } } }';

/* ---------- small helpers ---------- */
function $(s){ return document.querySelector(s); }
function h(tag, props){
  const el = document.createElement(tag);
  if (props) for (const k of Object.keys(props)){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'data') Object.assign(el.dataset, v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, kid){
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(x => add(el, x)); return; }
  el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function chip(text, tone){ return h('span', {class:'chip' + (tone ? ' ' + tone : ''), text:text}); }
function bayTag(code){ return h('span', {class:'bay', text:code}); }
function btn(label, onclick, cls, extra){ return h('button', Object.assign({type:'button', class:'btn' + (cls ? ' ' + cls : ''), onclick:onclick}, extra || {}), label); }
function field(label, control){ return h('label', {class:'fld'}, h('span', {text:label}), control); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function nowISO(){ return new Date().toISOString(); }
function whenText(iso){ if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return L.fmtDay(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
let toastTimer = null;
function toast(text, bad){
  const t = $('#toast'); t.textContent = text; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 7000 : 3500);
}

/* ---------- talking to Shopify ---------- */
function problemOf(parsed){
  if (parsed.errors && parsed.errors.length) return {code:'graphql', message:parsed.errors.map(x => x.message).join(' ')};
  const ue = L.userErrorsOf(parsed.data);
  if (ue.length) return {code:'user_error', message:ue.map(x => x.message).join(' '), codes:ue.map(x => x.code).filter(Boolean)};
  return null;
}
async function callShopify(tool, args, opts){
  const mcp = S.cap.mcp;
  if (!mcp) throw {code:'no_mcp', message:'Shopify is not available in this view.'};
  let res;
  try { res = await mcp.callTool(SERVER, tool, args, opts); }
  catch (err){
    const parsed = L.extractGraphQL(err && err.result) || L.parseEmbeddedJson(err && err.message);
    if (parsed){ const p = problemOf(parsed); if (p) throw p; }
    throw {code:(err && err.code) || 'upstream_error', message:(err && err.message) || 'No answer from Shopify.', retryable:!!(err && err.retryable), retryAfterMs:err && err.retryAfterMs};
  }
  const parsed = L.extractGraphQL(res);
  if (!parsed) throw {code:'unreadable', message:'Shopify answered in a form this page could not read.'};
  const p = problemOf(parsed);
  if (p) throw p;
  return parsed.data;
}
/* a read: safe to try once more if Shopify says it was a passing fault */
function guardStore(d){
  const dom = d && d.shop && d.shop.myshopifyDomain;
  if (dom && dom !== L.STORE_DOMAIN){
    S.shop.state = 'wrong'; S.shop.name = dom; paintStore(); refresh();
    throw {code:'wrong_store', message:'This system is now connected to a different Shopify store.'};
  }
  return d;
}
async function sq(query, variables){
  const args = variables ? {query:query, variables:variables} : {query:query};
  try { return guardStore(await callShopify(T_QUERY, args, {cache:false})); }
  catch (e){
    if (!e.retryable) throw e;
    await sleep(Math.min(e.retryAfterMs || 700, 4000) + Math.random() * 400);
    return guardStore(await callShopify(T_QUERY, args, {cache:false}));
  }
}
/* a change: never sent twice by this page */
function sm(query, variables){ return callShopify(T_MUT, {query:query, variables:variables}); }
function explain(e, isWrite){
  const c = e && e.code;
  if (c === 'no_mcp' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Shopify cannot be reached from this screen. Reload the page. If it carries on, tell the owner.';
  if (c === 'needs_reauth') return 'Shopify would not accept this system’s key. The owner has to renew it in the hosting settings.';
  if (c === 'server_not_connected' || c === 'selection_required' || c === 'server_not_found') return 'Shopify has not been connected to this system yet. The owner adds the Shopify key in the hosting settings.';
  if (c === 'not_in_manifest' || c === 'consent_required') return 'Shopify access has not been allowed for this page.';
  if (c === 'approval_required') return 'That change was not approved. Nothing was changed.';
  if (c === 'blocked_by_policy') return 'This system’s Shopify key is not allowed to do that.';
  if (c === 'cancelled') return 'Cancelled. Nothing was changed.';
  if (c === 'wrong_store') return 'This system is connected to a different Shopify store, so this was stopped. The owner has to put that right.';
  if (c === 'user_error' || c === 'graphql' || c === 'tool_error') return 'Shopify said: ' + e.message;
  if (c === 'server_unavailable' || c === 'upstream_error' || c === 'rate_limited') return isWrite ? 'Shopify did not answer. The change may or may not have gone through, so check Shopify before trying again.' : 'Shopify did not answer. Try again in a moment.';
  return (e && e.message) || 'Something went wrong.';
}
function shopOK(){ return S.shop.state === 'ok'; }
function needShop(){
  if (shopOK()) return true;
  toast(S.shop.state === 'wrong' ? 'The wrong Shopify store is connected, so nothing can be changed.' : 'Shopify is not connected yet.', true);
  return false;
}
async function connectShop(){
  S.shop.state = 'connecting'; S.shop.msg = ''; paintStore();
  if (!S.cap.mcp){ S.shop.state = 'down'; S.shop.msg = explain({code:'no_mcp'}); paintStore(); refresh(); return; }
  try {
    const d = await callShopify(T_QUERY, {query:Q_SHOP}, {cache:false});
    S.shop.name = d.shop.name; S.shop.domain = d.shop.myshopifyDomain;
    S.shop.locations = ((d.locations && d.locations.nodes) || []).filter(l => l.isActive);
    S.shop.state = d.shop.myshopifyDomain === L.STORE_DOMAIN ? 'ok' : 'wrong';
  } catch (e){ S.shop.state = 'down'; S.shop.msg = explain(e); }
  paintStore(); refresh();
  if (shopOK()) startInbox();
}
function paintStore(){
  const el = $('#store'), tx = $('#storeText'), st = S.shop.state;
  el.className = 'store' + (st === 'ok' ? ' ok' : st === 'connecting' ? '' : ' bad');
  tx.textContent = st === 'ok' ? 'Shopify live' : st === 'connecting' ? 'Connecting to Shopify' : st === 'wrong' ? 'Wrong store: ' + S.shop.name : 'Shopify not connected';
}
function useInbox(parsed, storedAt){
  if (parsed && parsed.data && parsed.data.orders){ S.inbox.orders = parsed.data.orders.nodes || []; S.inbox.state = 'ok'; S.inbox.at = storedAt || Date.now(); S.inbox.msg = ''; }
  else { S.inbox.state = 'error'; S.inbox.msg = 'Could not read the order list from Shopify.'; }
}
async function loadInboxOnce(){
  try { const d = await sq(Q_INBOX); useInbox({data:d}); }
  catch (e){ S.inbox.state = 'error'; S.inbox.msg = explain(e); }
  refresh();
}
function startInbox(){
  if (S.inboxUnsub || S.inboxTimer) return;
  S.inbox.state = 'loading';
  try {
    S.inboxUnsub = S.cap.mcp.watchTool(SERVER, T_QUERY, {query:Q_INBOX}, ev => {
      if (ev.type === 'data'){
        const parsed = L.extractGraphQL(ev.result);
        try { guardStore(parsed && parsed.data); } catch (e){ S.inbox.orders = []; S.inbox.state = 'error'; S.inbox.msg = explain(e); refresh(); return; }
        useInbox(parsed, ev.result && ev.result.cache && ev.result.cache.storedAt);
      }
      else {
        const c = ev.error && ev.error.code;
        if (c === 'bad_request' && !S.inboxTimer){ /* this connector cannot be watched: ask on a timer instead */
          S.inboxTimer = setInterval(() => { if (!document.hidden && shopOK()) loadInboxOnce(); }, 120000); loadInboxOnce(); return;
        }
        if (['needs_reauth','server_not_connected','blocked_by_policy','approval_required','not_in_manifest'].indexOf(c) !== -1) S.inbox.orders = [];
        S.inbox.state = 'error'; S.inbox.msg = explain(ev.error || {});
      }
      refresh();
    }, {refetchInterval:120000});
  } catch (e){ loadInboxOnce(); }
}
async function refreshInbox(){
  S.inbox.state = 'loading'; refresh();
  await loadInboxOnce();
}
function inboxList(){
  return S.inbox.orders.filter(o => L.inboxWorthy(o) && !S.jobs.has('o' + L.gidNum(o.id)) && !S.skipped.has(L.gidNum(o.id)));
}

/* ---------- saved records (jobs, tasks, bays) ---------- */
const chains = new Map();
function queue(path, fn){ const prev = chains.get(path) || Promise.resolve(); const next = prev.catch(() => {}).then(fn); chains.set(path, next); return next; }
function logEntry(text){ const o = {}; o['g' + uid()] = {at:nowISO(), by:S.me.id || '', text:text}; return o; }
function needDb(){ if (S.cap.db && S.db.state !== 'off') return true; toast('Saved jobs are not available in this view, so nothing can be saved.', true); return false; }
function patchJob(id, patch, text){
  const p = text ? Object.assign({}, patch, {log:logEntry(text)}) : patch;
  return queue('jobs/' + id, () => S.cap.db.doc('jobs/' + id).update(p));
}
function createJob(id, job, text){
  job.log = logEntry(text);
  return queue('jobs/' + id, () => S.cap.db.doc('jobs/' + id).set(job));
}
function logDay(text){
  if (!S.cap.db) return Promise.resolve();
  const day = L.todayISO(), ref = S.cap.db.doc('activity/' + day);
  return queue('activity/' + day, async () => {
    const snap = await ref.get();
    if (snap.exists) await ref.update({items:logEntry(text)}); else await ref.set({day:day, items:logEntry(text)});
  }).catch(() => {});
}
function saveSettings(patch){
  const ref = S.cap.db.doc('settings/main');
  return queue('settings/main', async () => {
    const snap = await ref.get(); const cur = snap.exists ? snap.data() : {};
    await ref.set({
      fitters: patch.fitters || (Array.isArray(cur.fitters) ? cur.fitters.slice() : []),
      estimators: patch.estimators || (Array.isArray(cur.estimators) ? cur.estimators.slice() : []),
      areas: patch.areas || (Array.isArray(cur.areas) ? cur.areas.slice() : []),
      bays: patch.bays || (Array.isArray(cur.bays) ? cur.bays.slice() : [])
    });
  });
}
function patchDoc(path, patch){ return queue(path, () => S.cap.db.doc(path).update(patch)); }
function takeDone(){ return !!(S.take && S.take.status === 'done'); }
function dbFail(e){ toast(e && e.code === 'invalid_argument' ? 'This login can look but not save. Ask the owner for access.' : 'Could not save. Check the connection and try again.', true); }
function startDb(){
  const db = S.cap.db;
  if (!db){ S.db.state = 'off'; refresh(); return; }
  const slow = setTimeout(() => { if (S.db.state === 'loading'){ S.db.state = 'slow'; refresh(); } }, 10000);
  const dead = e => { clearTimeout(slow); S.db.state = 'off'; S.db.msg = (e && e.code) || ''; refresh(); };
  const quiet = () => {};
  db.collection('jobs').onSnapshot(snap => {
    const before = S.jobs, fresh = new Map(snap.docs.map(d => [d.id, Object.assign({id:d.id}, d.data())]));
    if (S.db.state === 'ok' && !S.fitterMode) fresh.forEach((j, id) => {
      const b = L.backOpen(j), was = L.backOpen(before.get(id));
      if (b && (!was || was.k !== b.k)) toast((b.fitter || 'A fitter') + ' has sent ' + ((j.customer || {}).name || 'a job') + ' back to the shop. See Act now on Today.', true);
    });
    S.jobs = fresh;
    if (!snap.metadata.fromCache){ clearTimeout(slow); S.db.state = 'ok'; }
    onData();
  }, dead);
  db.collection('tasks').onSnapshot(snap => { S.tasks = snap.docs.map(d => Object.assign({id:d.id}, d.data())); onData(); }, quiet);
  db.doc('settings/main').onSnapshot(snap => {
    const d = snap.exists ? snap.data() : {};
    S.fitters = Array.isArray(d.fitters) ? d.fitters.slice() : []; S.bays = Array.isArray(d.bays) ? d.bays.slice() : [];
    S.estimators = Array.isArray(d.estimators) ? d.estimators.slice() : [];
    S.areas = Array.isArray(d.areas) ? d.areas.filter(a => a && a.name && Array.isArray(a.codes)) : [];
    onData();
  }, quiet);
  db.collection('bays').onSnapshot(snap => { S.homeBays = new Map(snap.docs.map(d => [d.id, d.data()])); onData(); }, quiet);
  db.collection('skipped').onSnapshot(snap => { S.skipped = new Set(snap.docs.map(d => d.id)); onData(); }, quiet);
  db.collection('activity').orderBy('day', 'desc').limit(14).onSnapshot(snap => { S.activity = snap.docs.map(d => d.data()); onData(); }, quiet);
  db.collection('deliveries').onSnapshot(snap => { S.deliveries = new Map(snap.docs.map(d => [d.id, Object.assign({id:d.id}, d.data())])); onData(); }, quiet);
  db.doc('stocktake/main').onSnapshot(snap => { S.take = snap.exists ? snap.data() : null; onData(); }, quiet);
  db.collection('timeoff').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { const x = d.data(); if (x && x.name) o[x.name] = x.days || {}; }); S.off = o; onData(); }, quiet);
  db.collection('counts').onSnapshot(snap => { S.counts = snap.docs.map(d => Object.assign({id:d.id}, d.data())); onData(); }, quiet);
}
function editingIn(root){
  const a = document.activeElement;
  if (!a || !root.contains(a)) return false;
  return a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(a.type));
}
function onData(){
  refresh();
  const sheet = $('#sheet');
  if ((!S.openJob && !S.openDelivery) || sheet.hidden) return;
  if (editingIn(sheet)) S.sheetDirty = true; else redrawSheet();
}
function redrawSheet(){ if (S.openJob) drawSheet(); else if (S.openDelivery) drawDelivery(); }
function nameOf(id){ return (id && S.names[id]) || (id && id === S.me.id && S.me.name) || 'Staff'; }
function learnNames(ids){
  const u = S.cap.user; if (!u || !u.profiles) return;
  const want = ids.filter(i => i && !S.asked[i]); if (!want.length) return;
  want.forEach(i => { S.asked[i] = 1; });
  u.profiles(want).then(ps => { let got = false; Object.keys(ps || {}).forEach(i => { if (ps[i] && ps[i].name){ S.names[i] = ps[i].name; got = true; } }); if (got) refresh(); });
}

/* ---------- shell ---------- */
const TABS = [
  {id:'today', label:'Today'}, {id:'jobs', label:'Jobs'}, {id:'sale', label:'New sale', cls:'only-phone sale'},
  {id:'diary', label:'Diary'}, {id:'measures', label:'Measures', cls:'only-desk'}, {id:'stock', label:'Stock'}, {id:'deliveries', label:'Deliveries', cls:'only-desk'},

  {id:'more', label:'More', cls:'only-phone'}
];
const VIEWS = {};
function attentionJobs(){ const t = L.todayISO(); return jobsArr().filter(j => L.warningsOf(j, t, S.off).some(w => w.tone === 'bad' || j.status === 'done')); }
/* jobs a fitter has handed back from site, and visits left unfinished with no return date: the shop acts on these first */
function actNowJobs(){
  const at = j => { const b = L.backOpen(j), vs = L.visitsOf(j); return b ? b.at : vs.length ? vs[vs.length - 1].at : ''; };
  return openJobs().filter(j => L.backOpen(j) || j.ret === 'needed').sort((a, b) => String(at(b)).localeCompare(String(at(a))));

function actRow(job){
  const c = job.customer || {}, b = L.backOpen(job), vs = L.visitsOf(job), last = vs[vs.length - 1];
  const head = b ? 'Sent back by ' + (b.fitter || 'the fitter') + ' ' + whenText(b.at) : 'Not finished and no return date agreed' + (last ? ', ' + (last.fitter || 'the fitter') + ' ' + whenText(last.at) : '');
  const what = b ? L.backReason(b) + (b.note ? '. ' + b.note : '') : [last && last.remains ? 'Left to do: ' + last.remains : '', job.retWhy ? 'No date because: ' + job.retWhy : ''].filter(Boolean).join('. ');

      h('div', {class:'meta'}, chip(job.type || 'Job'), c.phone ? chip(c.phone) : null, b && L.validISO(b.date) ? chip('Was booked for ' + L.fmtDay(b.date) + (b.slot ? ' ' + b.slot : '')) : null, b && L.picsOf(b).length ? chip(L.picsOf(b).length + (L.picsOf(b).length === 1 ? ' photo' : ' photos')) : null)),
    h('div', {class:'end'}, chip(b ? 'Sent back' : 'Return visit needed', 'bad')));

function paintTabs(){
  const box = $('#tabs'); box.replaceChildren();
  const badge = {today:inboxList().length + actNowJobs().length, jobs:attentionJobs().length, diary:overdueArrivals('').length, measures:lateVisits(), deliveries:deliveryAlerts(), tasks:S.tasks.filter(t => !t.done && (!t.due || t.due <= L.todayISO())).length};
  TABS.forEach(t => {
    const on = S.view === t.id || (t.id === 'more' && ['tasks','activity','setup','deliveries','stocktake','measures'].indexOf(S.view) !== -1 && window.matchMedia('(max-width: 760px)').matches);
    box.append(h('button', {type:'button', class:'tab' + (t.cls ? ' ' + t.cls : '') + (on ? ' on' : ''), onclick:() => { if (t.id === 'sale') saleDialog(); else go(t.id); }},

function go(view){
  if (!VIEWS[view]) view = 'today';
  S.view = view; S.fitterMode = view === 'fitter';
  document.body.classList.toggle('fitter-mode', S.fitterMode);
  try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch (e) {}
  const built = VIEWS[view](), box = $('#view');
  box.replaceChildren(); add(box, built.nodes);
  S.refreshView = built.refresh || null;

  window.scrollTo(0, 0);
}

function banners(){

  else if (S.shop.state === 'down') out.push(h('div', {class:'banner warn'}, h('p', {class:'grow'}, h('b', {text:'Shopify is not connected. '}), S.shop.msg + ' Jobs and the diary still work. Stock and new sales are paused.'), btn('Try again', connectShop, 'sm')));

async function fillCoverage(id, job, quiet){

    (d.nodes || []).forEach(v => { if (v) by[v.id] = v; });

function fitterEntries(person){
  const out = [];
  openJobs().forEach(j => {
    if (j.fitter === person && L.validISO(j.date) && L.linesOf(j).length && j.type !== 'Collection') out.push({job:j, v:null, date:j.date, slot:j.slot || '', label:j.ret === 'booked' ? 'Return visit' : j.type, firm:j.diary === true});
    L.preOf(j).forEach(v => { if (v.who === person && v.status === 'booked' && L.validISO(v.date)) out.push({job:j, v:v, date:v.date, slot:v.slot || '', label:L.PRE_KINDS[v.kind], firm:true}); });
  });
  const rank = {AM:'1', '':'2', PM:'3'};
  return out.sort((a, b) => (a.date + (rank[a.slot] || '2')).localeCompare(b.date + (rank[b.slot] || '2')));
}

/* pictures: stored with the page, the job keeps only the id */
function picProblem(e){
  const c = e && e.code;
  if (c === 'too_large') return 'That picture is too big to store. Try a smaller one.';
  if (c === 'unsupported_type') return 'That kind of file cannot be stored. Use a photo, a PNG or a JPEG.';
  if (c === 'quota_or_state') return 'The picture store for this page is full or not available. Nothing was saved.';
  if (c === 'rate_limited') return 'Too many pictures at once. Wait a moment and try again.';
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Pictures cannot be added from this login.';
  if (c === 'upstream_auth') return 'Reload the page and sign in again, then add the picture.';
  return 'The picture could not be stored. Try again.';
}
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file), sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.size < 1500000 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch (e){ return file; }
}
async function storePic(blob){
  const a = S.cap.assets;
  if (!a) throw {code:'not_granted'};
  if (!/^image\/(png|jpeg|gif|webp)$/.test(blob.type)) throw {code:'unsupported_type'};
  try { return await a.upload(blob, {type:blob.type}); }
  catch (e){ if (!e || e.code !== 'store_unavailable') throw e; await sleep(1200); return a.upload(blob, {type:blob.type}); }
}
function picPatch(where, key, value){

/* installations and preliminary visits share the same contact rule, so they are listed together */
function contactItems(states){
  const t = L.todayISO(), out = [];
  openJobs().forEach(j => {
    const a = L.arrivalState(j, t);
    if (states.indexOf(a) !== -1) out.push({job:j, v:null, state:a, date:j.date, who:j.fitter || '', label:j.type, slot:j.slot || ''});
    L.preOf(j).forEach(v => { const s = L.preArrivalState(v, t); if (states.indexOf(s) !== -1) out.push({job:j, v:v, state:s, date:v.date, who:v.who || '', label:L.PRE_KINDS[v.kind], slot:v.slot || ''}); });
  });
  return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.job.ref).localeCompare(String(b.job.ref)));
}
function triesFor(it){ return it.v ? L.preTries(it.v) : L.triesOf(it.job); }

async function checkClosed(job){
  if (!needShop()) return;
  const left = [], patch = {drafts:{}};
  try {
    if (job.orderId){
      const d = await sq(Q_ORDER, {id:job.orderId}), o = d.order;
      if (o && o.displayFulfillmentStatus !== 'FULFILLED' && !o.cancelledAt) left.push('Order ' + job.orderName + ' is not marked fulfilled.');
    }
    for (const k of Object.keys(job.drafts || {})){
      const dr = job.drafts[k]; if (dr.deleted || dr.closed) continue;
      const d = await sq(Q_DRAFT, {id:dr.id}), x = d.draftOrder;
      if (!x){ patch.drafts[k] = {deleted:true}; continue; }
      if (x.status !== 'COMPLETED' || !x.order){ left.push('Draft ' + dr.name + ' has not been turned into an order.'); continue; }
      if (x.order.displayFulfillmentStatus !== 'FULFILLED' && !x.order.cancelledAt){ left.push('Order ' + x.order.name + ' is not marked fulfilled.'); patch.drafts[k] = {orderId:x.order.id, orderName:x.order.name}; continue; }
      patch.drafts[k] = {closed:true, orderId:x.order.id, orderName:x.order.name};
    }
  } catch (e){ toast(explain(e), true); return; }
  if (!left.length) patch.shopifyClosed = true;
  try { await patchJob(job.id, patch, left.length ? null : 'Closed off in Shopify'); } catch (e){ dbFail(e); return; }
  toast(left.length ? left.join(' ') : 'All closed off in Shopify', left.length > 0);
}

          const p = {lines:{}}; p.lines[b.l.k] = {returned:true}; await patchJob(job.id, p, 'Put ' + L.fmtQty(b.l.qty, b.l.unit) + ' of ' + b.l.title + ' back on sale in Shopify'); b.cb.checked = false; b.cb.disabled = true;

        }

/* ---------- a new sale, or more items for a job ---------- */
function gbp(n){ return {amount:L.round2(n).toFixed(2), currencyCode:'GBP'}; }
function unitsOf(l){ return l.roll ? Math.ceil(Number(l.qty) * 10 - 1e-9) : (parseInt(l.qty, 10) || 0); }
function lineTotal(l){
  if (l.kind === 'other') return L.round2((Number(l.price) || 0) * (parseInt(l.qty, 10) || 1));
  return l.roll ? L.round2(l.price) : L.round2((Number(l.price) || 0) * unitsOf(l));
}
function draftInput(ctx, tag){
  const items = [];
  ctx.lines.forEach(l => {
    if (l.kind === 'other'){ items.push({title:l.title, quantity:Math.max(1, parseInt(l.qty, 10) || 1), originalUnitPriceWithCurrency:gbp(l.price), requiresShipping:false}); return; }
    const units = unitsOf(l), size = l.roll ? ' ' + l.widthM + 'm x ' + Number(l.qty).toFixed(1) + 'm' : '';
    if (l.source === 'stock'){
      if (l.roll){ items.push({variantId:l.variantId, quantity:units}); items.push({title:'Carpet cut: ' + l.title + size, quantity:1, originalUnitPriceWithCurrency:gbp(l.price), requiresShipping:false}); }
      else { const it = {variantId:l.variantId, quantity:units}; if (Math.abs(Number(l.price) - Number(l.unitPrice)) > 0.004) it.priceOverride = gbp(l.price); items.push(it); }
    } else if (l.roll) items.push({title:l.title + size + ' (ordered in)', quantity:1, originalUnitPriceWithCurrency:gbp(l.price)});
    else items.push({title:l.title + (l.sub ? ' ' + l.sub : '') + ' (ordered in)', quantity:units, originalUnitPriceWithCurrency:gbp(l.price)});
  });
  const input = {lineItems:items, tags:['ifd-ops', 'shop-sale', tag]};
  const attrs = []; if (ctx.type) attrs.push({key:'Job type', value:ctx.type}); if (ctx.date) attrs.push({key:'Job date', value:ctx.date});
  if (attrs.length) input.customAttributes = attrs;
  if (ctx.note) input.note = ctx.note;
  if (ctx.lines.some(l => l.kind === 'stock' && l.source === 'stock')) input.reserveInventoryUntil = new Date(Date.now() + 365 * 86400000).toISOString();
  const c = ctx.customer || {};
  if (c.shopifyId) input.purchasingEntity = {customerId:c.shopifyId}; else if (c.email) input.email = c.email;
  const parts = String(c.name || '').trim().split(/\s+/).filter(Boolean);
  const addr = {countryCode:'GB'};
  if (parts.length){ addr.firstName = parts.length > 1 ? parts.slice(0, -1).join(' ') : parts[0]; addr.lastName = parts.length > 1 ? parts[parts.length - 1] : parts[0]; }
  if (c.address) addr.address1 = c.address; if (c.postcode) addr.zip = c.postcode; if (c.phone) addr.phone = c.phone;
  input.shippingAddress = addr;
  return input;
}
async function reserveInShopify(ctx, say, always){
  const stock = ctx.lines.filter(l => l.kind === 'stock' && l.source === 'stock');
  if (!stock.length && !always) return {draft:null};
  const need = {}; stock.forEach(l => { need[l.variantId] = (need[l.variantId] || 0) + unitsOf(l); });
  const ids = Object.keys(need);
  if (!ids.length) await sq(Q_DRAFT_TAG, {q:'tag:ops-store-check'});
  if (ids.length){
    say('Checking stock in Shopify');
    const d = await sq(Q_VARIANTS, {ids:ids}), by = {};
    (d.nodes || []).forEach(n => { if (n) by[n.id] = n; });
    for (const id of ids){
      const l = stock.find(x => x.variantId === id), v = by[id];
      if (!v) throw {user:l.title + ' is no longer in Shopify.'};
      const f = L.levelFigures(v);
      if (!f.tracked) throw {user:'Shopify is not tracking stock for ' + l.title + '. Switch that line to Order in.'};
      if (f.total.available < need[id]) throw {user:'Only ' + L.fmtQty(Math.max(0, f.total.available), l.unit) + ' of ' + l.title + ' is free in Shopify. Lower the quantity or switch that line to Order in.'};
    }
  }
  say('Saving the sale in Shopify');
  const tag = 'ops-' + uid(); let draft = null;
  try { const d = await sm(M_DRAFT_CREATE, {input:draftInput(ctx, tag)}); draft = d.draftOrderCreate && d.draftOrderCreate.draftOrder; }
  catch (e){
    if (['server_unavailable', 'upstream_error', 'rate_limited'].indexOf(e.code) === -1) throw e;
    await sleep(1500); let found;
    try { const d = await sq(Q_DRAFT_TAG, {q:'tag:' + tag}); found = d.draftOrders.nodes[0]; }
    catch (e2){ throw {user:'Shopify did not answer. Before trying again, look in Shopify under Orders, Drafts for one tagged ' + tag + '.'}; }
    if (!found) throw {user:'Shopify did not answer and nothing was saved. Press the button again.'};
    draft = found;
  }
  if (!draft) throw {user:'Shopify did not create the sale. Nothing was reserved.'};
  if (ids.length){
    say('Checking nothing was sold twice');
    let over = null;
    try { const d = await sq(Q_VARIANTS, {ids:ids}); (d.nodes || []).forEach(n => { if (n && !over && L.levelFigures(n).total.available < 0) over = n; }); }
    catch (e){ return {draft:draft, warn:'Saved, but the last stock check could not run. Look at the stock figure in Shopify.'}; }
    if (over){
      const l = stock.find(x => x.variantId === over.id) || stock[0];
      try { await sm(M_DRAFT_DELETE, {input:{id:draft.id}}); }
      catch (e){ throw {user:'Someone took the last of ' + l.title + ' at the same moment, and draft ' + draft.name + ' could not be removed. Delete that draft in Shopify now.'}; }
      throw {user:'Someone took the last of ' + l.title + ' at the same moment. Nothing has been reserved. Check the stock and try again.'};
    }
  }
  return {draft:draft};
}
function toJobLines(lines, startN, draftName){
  const out = {}; let n = startN;
  lines.forEach(l => {
    n++; const k = 'l' + n + 'x' + uid().slice(-4);
    if (l.kind === 'other'){ out[k] = {n:n, title:l.title, sub:'', unit:'items', qty:Math.max(1, parseInt(l.qty, 10) || 1), hold:'none', price:lineTotal(l)}; return; }
    const base = {n:n, variantId:l.variantId, title:l.title, sub:l.sub || '', unit:l.unit, qty:unitsOf(l), price:lineTotal(l), state:'todo', picked:false, checked:false};
    if (l.roll && l.widthM > 0) base.w = l.widthM; else if (l.cov > 0) base.cov = l.cov;
    if (l.source === 'stock') out[k] = Object.assign(base, {hold:'draft', holdRef:draftName || ''});
    else out[k] = Object.assign(base, {hold:'supplier', holdRef:'', supplier:l.supplier || '', due:l.due || '', state:(l.supplier || l.due) ? 'ordered' : 'todo'});
  });
  return out;
}

  redrawSheet();

  if (!line.variantId){ await setRec({shop:'skip', msg:'Not a Shopify product, so no stock figure was changed.'}); return finishReceipt(dId, lk, rk, line, rec); }
  const unsure = rec.shop === 'sending' || rec.shop === 'pending';
  if (!shopOK()){ await setRec({shop:unsure ? 'pending' : 'error', msg:'Shopify is not connected, so nothing was added.'}).catch(() => {}); throw {code:'x', message:'Shopify is not connected.'}; }
  let v;
  try { v = await freshVariant(line.variantId); }
  catch (e){ await setRec({shop:unsure ? 'pending' : 'error', msg:explain(e)}).catch(() => {}); throw e; }
  const fig = L.levelFigures(v);
  if (!fig.tracked){ await setRec({shop:'skip', msg:'Shopify is not tracking stock for this product, so its figure was not changed.'}); return finishReceipt(dId, lk, rk, line, rec); }

    throw {code:'x', message:'Check Shopify before retrying.'};
  }

  if (name === 'reserved') change.ledgerDocumentUri = 'gid://ifd-ops/Job/' + (line.jobId || 'none');

      }
      const uncounted = []; let after = null;
      for (let page = 0; page < 8; page++){
        const d = await sq(Q_STOCKED, {after:after}), pr = d.products;
        (pr.nodes || []).forEach(p => ((p.variants && p.variants.nodes) || []).forEach(v => { if (by.has(v.id) || !(v.inventoryItem && v.inventoryItem.tracked) || !(v.inventoryQuantity > 0)) return; uncounted.push({variantId:v.id, title:variantTitle(p, v), unit:L.unitFor(v, p), shopify:v.inventoryQuantity}); }));
        if (!pr.pageInfo || !pr.pageInfo.hasNextPage) break; after = pr.pageInfo.endCursor;
      }
      U.review = {rows:Array.from(by.values()), uncounted:uncounted};
      if (S.take && S.take.status === 'counting') await patchDoc('stocktake/main', {status:'review'});
    } catch (e){ U.busy = false; say(explain(e), true); return; }
    U.busy = false; draw(true);
  }
  async function apply(row, counted){
    if (!needShop() || U.busy) return;
    U.busy = true; say('');
    try {
      const v = await freshVariant(row.variantId), f = L.levelFigures(v), num = L.gidNum(row.variantId);
      if (!f.tracked) throw {code:'x', message:'Shopify is not tracking stock for ' + row.title + '. Turn tracking on for it in Shopify, then apply.'};
      if (f.per.length !== 1) throw {code:'x', message:row.title + ' is held in more than one Shopify location. Set that one in Shopify by hand.'};
      const lv = f.per[0], plan = L.countPlan(counted, lv, L.shelfMaths(row.variantId, jobsArr()));
      if (plan.conflict) throw {code:'x', message:'Fewer ' + row.title + ' are on the shelf than are promised to customers. Sort those jobs first, then apply.'};
      if (plan.free !== lv.available) await sm(M_SET('stk-' + num + '-' + lv.available + '-' + plan.free), {input:{name:'available', reason:'cycle_count_available', quantities:[{inventoryItemId:v.inventoryItem.id, locationId:lv.id, quantity:plan.free, changeFromQuantity:lv.available}]}});
      const a = {applied:{}}; a.applied[num] = {at:nowISO(), by:S.me.id || '', counted:counted, free:plan.free, was:lv.available};
      await patchDoc('stocktake/main', a);
      const bays = Object.keys(row.bays || {}).filter(L.isFinalBay).sort((x, y) => row.bays[y] - row.bays[x]);
      if (bays.length) await setHomeBay(num, bays[0]).catch(() => {});
      logDay('Stocktake: ' + row.title + ' counted ' + L.fmtQty(counted, row.unit) + '. Free to sell in Shopify ' + L.fmtQty(lv.available, row.unit) + ' to ' + L.fmtQty(plan.free, row.unit));
      row.fig = Object.assign({}, lv, {available:plan.free, on_hand:plan.onHand}); row.plan = Object.assign({}, plan, {change:0});
    } catch (e){ U.busy = false; say(isStale(e) ? 'Shopify’s figure for ' + row.title + ' changed since the review. Press Review again.' : e.code === 'x' ? e.message : explain(e, true), true); return; }
    U.busy = false; draw(true);
  }
  function isApplied(row){ const a = S.take && S.take.applied && S.take.applied[L.gidNum(row.variantId)]; return !!(a && a.counted === row.counted); }
  async function finish(){
    try { await patchDoc('stocktake/main', {status:'done', doneAt:nowISO(), doneBy:S.me.id || ''}); logDay('Opening stocktake finished'); toast('Opening stocktake finished'); } catch (e){ dbFail(e); }
  }
  function draw(force){
    if (!force && editingIn(body)) return;
    const st = S.take ? S.take.status : 'none';
    body.replaceChildren();
    if (U.msg) body.append(h('div', {class:'banner ' + (U.msg.bad ? 'bad' : 'info')}, h('p', {text:U.msg.text})));
    if (st === 'none'){
      body.append(h('div', {class:'card'}, h('h3', {}, 'Not started', chip('Awaiting opening stocktake', 'warn')),
        h('p', {text:'Count what is physically in each bay and on each rack. Nothing in Shopify changes until you review the differences and apply them one product at a time.'}),
        h('p', {class:'muted', text:'A count sets the figure. It never adds to it, so a delivery that has already been received is not counted twice.'}),
        h('div', {class:'bar'}, btn('Start the opening stocktake', start, 'pri'))));
      return;
    }
    if (st === 'done'){
      body.append(h('div', {class:'card'}, h('h3', {}, 'Finished', chip('Stock checked ' + whenText(S.take.doneAt), 'ok')),
        h('p', {text:Object.keys(S.take.applied || {}).length + ' products were counted and set in Shopify. Use Count on the Stock screen for any later correction.'})));
      return;
    }
    const bayPick = bayPicker('stBay', U.bay, 'Choose the bay or rack'); bayPick.addEventListener('change', e => { U.bay = e.target.value; });
    const mine = S.counts.slice().sort((a, b) => String(b.at).localeCompare(String(a.at)));
    body.append(h('div', {class:'card'}, h('h3', {}, 'Count a location', chip(mine.length + (mine.length === 1 ? ' count' : ' counts') + ' so far', 'info')),
      h('div', {class:'grid2'}, field('Bay or rack position', bayPick), field('Product or roll', finder.input)), finder.results, picked,
      h('div', {class:'bar'}, h('div', {style:'width:160px'}, qty), btn('Add this count', addCount, 'pri'))));
    body.append(h('section', {class:'sec'}, h('h2', {}, 'Counted so far'),
      listOf(mine.slice(0, 60).map(c => h('div', {class:'row static'}, bayTag(c.bay), h('div', {class:'grow'}, h('div', {class:'who', text:c.title}), h('div', {class:'sub', text:L.fmtQty(c.qty, c.unit) + ' · ' + whenText(c.at)})),
        btn('Remove', () => { U.review = null; S.cap.db.doc('counts/' + c.id).delete().catch(dbFail); }, 'sm'))), 'Nothing counted yet', 'Each count is one product in one bay. Count the same product again in another bay and the totals are added up.')));
    const rv = U.review;
    const sec = h('section', {class:'sec'}, h('h2', {}, 'Review against Shopify', h('span', {class:'grow'}), btn(U.busy ? 'Working' : rv ? 'Review again' : 'Review the differences', runReview, 'sm pri', {disabled:U.busy || !mine.length})));
    if (rv){
      sec.append(listOf(rv.rows.map(r => {
        const done = isApplied(r), held = r.m ? r.m.heldWeb + r.m.heldSupplier : 0;
        return h('div', {class:'row static'},
          h('div', {class:'grow'}, h('div', {class:'who', text:r.title}),
            h('div', {class:'sub', text:!r.found ? 'No longer in Shopify.' : 'Counted ' + L.fmtQty(r.counted, r.unit) + ' in ' + Object.keys(r.bays).join(', ') + '. Shopify shows ' + L.fmtQty(r.fig.available, r.unit) + ' free' + (r.fig.on_hand - r.fig.available ? ' and ' + L.fmtQty(r.fig.on_hand - r.fig.available, r.unit) + ' held' : '') + '.' + (held ? ' ' + L.fmtQty(held, r.unit) + ' of the count is set aside for jobs.' : '')}),
            h('div', {class:'meta'}, !r.found ? chip('Not found', 'bad') : !r.tracked ? chip('Shopify is not tracking this', 'warn') : r.plan.conflict ? chip('Fewer than promised to customers', 'bad') : done ? chip('Applied', 'ok') : r.plan.change === 0 ? chip('Matches Shopify', 'ok') : chip('Free to sell ' + (r.plan.change > 0 ? 'up ' : 'down ') + L.fmtQty(Math.abs(r.plan.change), r.unit) + ' to ' + L.fmtQty(r.plan.free, r.unit), 'warn'))),
          r.found && r.tracked && !r.plan.conflict && !done ? btn(r.plan.change === 0 ? 'Confirm' : 'Apply to Shopify', () => apply(r, r.counted), 'sm pri', {disabled:U.busy}) : null);
      }), 'No counts to review', ''));
      if (rv.uncounted.length) sec.append(h('h3', {text:'In Shopify but not counted (' + rv.uncounted.length + ')'}), listOf(rv.uncounted.slice(0, 80).map(r => h('div', {class:'row static'},
        h('div', {class:'grow'}, h('div', {class:'who', text:r.title}), h('div', {class:'sub', text:'Shopify shows ' + L.fmtQty(r.shopify, r.unit) + ' free. Count it, or confirm there is none.'})),
        btn('None on the shelf', () => apply({variantId:r.variantId, title:r.title, unit:r.unit, counted:0, bays:{}}, 0).then(() => { rv.uncounted = rv.uncounted.filter(x => x !== r); draw(true); }), 'sm', {disabled:U.busy}))), '', ''));
      const left = rv.rows.filter(r => r.found && r.tracked && !isApplied(r)).length, ackBox = h('input', {type:'checkbox', id:'stAck', checked:U.ack, onchange:e => { U.ack = e.target.checked; draw(true); }});
      sec.append(h('div', {class:'card'}, h('h3', {}, 'Finish'),
        rv.uncounted.length ? h('label', {class:'tick'}, ackBox, 'The ' + rv.uncounted.length + ' uncounted products above are right as Shopify shows them') : null,
        h('p', {class:'muted', text:left ? left + (left === 1 ? ' counted product still has' : ' counted products still have') + ' to be applied or confirmed.' : 'Every counted product is applied.'}),
        h('div', {class:'bar'}, btn('Finish the opening stocktake', finish, 'pri', {disabled:left > 0 || (rv.uncounted.length > 0 && !U.ack)}))));
    }
    body.append(sec);
  }
  return {nodes:[h('div', {class:'head'}, h('div', {}, h('h1', {text:'Opening stocktake'}), h('p', {text:'Count by location, review the differences, then set Shopify one product at a time.'}))), body], refresh:() => draw(false)};
};

/* ---------- start ---------- */
async function boot(){
  $('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) closeSheet(); });
  $('#sheet').addEventListener('focusout', () => setTimeout(() => { if (S.sheetDirty && (S.openJob || S.openDelivery) && !editingIn($('#sheet'))) redrawSheet(); }, 80));
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$('#modal').hidden) closeModal(); else if (!$('#sheet').hidden) closeSheet(); });
  $('#newSaleTop').addEventListener('click', () => saleDialog());
  $('#newMeasureTop').addEventListener('click', () => measureDialog());
  $('#store').addEventListener('click', () => { if (S.shop.state !== 'connecting') connectShop(); });
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view && VIEWS[v]) go(v); });
  go((location.hash || '').slice(1) || 'today');
  const use = name => { try { return (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };
  use('assets').then(a => { S.cap.assets = a; if (a && S.openJob && !$('#sheet').hidden && !editingIn($('#sheet'))) drawSheet(); });
  const caps = await Promise.all([use('db'), use('mcp'), use('user'), use('downloads')]);
  S.cap.db = caps[0]; S.cap.mcp = caps[1]; S.cap.user = caps[2]; S.cap.downloads = caps[3];
  if (S.cap.user){ try { const me = await S.cap.user.me(); S.me = {id:me.id || '', name:me.name || ''}; } catch (e) {} }
  startDb(); connectShop();
}
boot();
})();
</script>
