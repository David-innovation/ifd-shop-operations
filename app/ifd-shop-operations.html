<title>IFD Shop Operations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: an app shell. A sticky top bar carries the store light; tabs run across the top on a desktop
   and along the bottom on a phone. Lists read like fitting sheets, and bay codes are printed like rack labels. */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --sunk:#e8eae4; --ink:#14181a; --muted:#566065; --line:#d3d7cf;
  --brand:#14181a; --on-brand:#ffffff; --gold:#9a7226;
  --label:#ffd21f; --on-label:#14181a;
  --ok:#1b7340; --ok-bg:#dcf1e3; --warn:#7d5200; --warn-bg:#fcebbf; --bad:#b0241c; --bad-bg:#fadfdb; --info:#1b5683; --info-bg:#dbe9f6;
  --focus:#1b5683; --shade:rgba(20,24,26,.45); --paper:#ffffff; --pen:#14181a;
  --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101314; --surface:#1a1e20; --sunk:#141718; --ink:#edf0ee; --muted:#9aa4a7; --line:#2d3336;
  --brand:#edf0ee; --on-brand:#101314; --gold:#d6ab5c;
  --label:#ffd21f; --on-label:#14181a;
  --ok:#72d49a; --ok-bg:#133423; --warn:#f1c463; --warn-bg:#3a2c0a; --bad:#ff9f96; --bad-bg:#431a17; --info:#92c6ef; --info-bg:#14304a;
  --focus:#92c6ef; --shade:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101314; --surface:#1a1e20; --sunk:#141718; --ink:#edf0ee; --muted:#9aa4a7; --line:#2d3336;
  --brand:#edf0ee; --on-brand:#101314; --gold:#d6ab5c;
  --label:#ffd21f; --on-label:#14181a;
  --ok:#72d49a; --ok-bg:#133423; --warn:#f1c463; --warn-bg:#3a2c0a; --bad:#ff9f96; --bad-bg:#431a17; --info:#92c6ef; --info-bg:#14304a;
  --focus:#92c6ef; --shade:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px;font-family:var(--font-body);font-weight:700;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.grow{flex:1;min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.store{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 10px;min-height:32px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.store i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.store.ok{background:var(--ok-bg);color:var(--ok)} .store.ok i{background:var(--ok)}
.store.bad{background:var(--bad-bg);color:var(--bad)} .store.bad i{background:var(--bad)}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;max-width:1180px;margin:0 auto;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));overflow-x:auto}
.tab{appearance:none;border:0;background:none;cursor:pointer;padding:12px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .badge{font-size:12px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--bad-bg);color:var(--bad);text-align:center}
.tab.only-phone{display:none}

/* page */
#view{max-width:1180px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{display:flex;flex-direction:column;gap:8px}
.sec > h2{display:flex;align-items:baseline;gap:8px}
.sec > h2 span{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted)}

/* buttons and fields */
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:44px}
textarea.in{min-height:84px;resize:vertical}
.in.sm{min-height:36px;padding:5px 8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 8px;min-height:44px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.seg.sm button{min-height:34px;padding:4px 8px;font-size:13px}

/* chips and the rack label */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.bay{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.04em;padding:1px 7px;background:var(--label);color:var(--on-label);border-radius:3px;white-space:nowrap}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile b{font-family:var(--font-display);font-size:34px;line-height:1}
.tile span{font-weight:600}
.tile small{color:var(--muted);font-size:13px}
.tile.hot{border-color:var(--bad);background:var(--bad-bg)} .tile.hot b{color:var(--bad)}
.actnow h2{color:var(--bad)} .actnow .list{border:1.5px solid var(--bad)}
.etiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.etiles .tile{padding:10px 12px} .etiles .tile b{font-size:28px} .etiles .tile small{font-size:12px}
.estrip{display:flex;flex-direction:column;gap:6px}
.estrow{appearance:none;font:inherit;color:inherit;display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;min-width:0}
.estrow:hover{border-color:var(--ink)} .estrow.hot{border-color:var(--bad);background:var(--bad-bg)}
.estrow b{font-size:16px} .estrow .what{flex:1 1 220px;min-width:0;color:var(--muted);overflow-wrap:anywhere} .estrow.hot .what{color:var(--ink);font-weight:600}
.estrow .open{font-weight:600;text-decoration:underline}
.qadd{display:flex;flex-wrap:wrap;gap:6px}
.qadd button{appearance:none;font:inherit;font-weight:600;font-size:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer}
.qadd button:hover{border-color:var(--ink)}
.brow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brow > .in{flex:1 1 150px;min-width:0;width:auto}
.spec{display:flex;flex-direction:column;gap:8px}
.spec.rest{border-top:1px solid var(--line);padding-top:10px}
.sqhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sqhead b{font-family:var(--font-display);font-size:19px}
.sq{display:flex;gap:6px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.sq > span{font-weight:600;flex:1 1 120px;min-width:0}
.sq .need{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-top:2px}
.sq.miss{border-color:var(--bad);background:var(--bad-bg)} .sq.miss .need{color:var(--bad)}
.sq .seg{flex:0 0 auto;min-width:150px;border-color:var(--muted)}
.sq .seg button{min-height:42px;padding:6px 14px;color:var(--ink);background:var(--surface);white-space:nowrap}
.sq .seg button + button{border-left-color:var(--muted)}
.sq .seg button.on{background:var(--brand);color:var(--on-brand)}
.sq .seg button.on.yes{background:var(--ok);color:var(--surface)}
.sq .sbars,.sq .sqnote{flex:1 1 100%}
.sbars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.hpart{border:1.5px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.hpart.miss{border-color:var(--bad)}
.hpart .still{margin:0;color:var(--bad);font-weight:700;font-size:13px}
.padtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.padtools .in{width:120px;flex:0 0 auto}
.pdir{display:block;margin-top:6px;max-width:100%;width:auto}
.psub{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.pline{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.pline:first-child{border-top:0} .pline span{min-width:0;overflow-wrap:anywhere} .pline b{text-align:right;flex:0 1 auto}
.broom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.broom.one{grid-template-columns:minmax(0,1fr) auto}
.bchoice{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.bchoice b{overflow-wrap:anywhere} .bchoice p{margin:2px 0 0}
.ticks{display:flex;flex-wrap:wrap;gap:2px 18px}
.fwrap h2.dh{margin:6px 0 0;font-family:var(--font-display);font-size:20px}
.fday.shopside > header small{color:var(--muted)}
.row.act{background:var(--bad-bg);align-items:flex-start}
.mroom{padding:8px 0;border-top:1px solid var(--line)} .mroom:first-child{border-top:0;padding-top:0}
.mroom .mt{display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.mroom p{margin:2px 0 0}
.qline{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qline:first-child{border-top:0}
.qline .qnote{grid-column:1 / -1;margin:0}
.qline .qcat{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
.qline .qcat .bar{align-items:center;flex-wrap:wrap}
.qline .qcat .in{max-width:170px;min-height:36px;padding:6px 10px}
.qline .in.price{text-align:right}
.qtotal{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;font-size:18px}
.qtotal b{font-family:var(--font-display);font-size:28px}
textarea.in.qmsg{min-height:260px;flex:0 0 auto;font-family:inherit;white-space:pre-wrap}
a.btn{text-decoration:none;color:inherit} a.btn.pri{color:var(--on-brand)} a.btn.off{opacity:.45;pointer-events:none}
.pricenow h2{color:var(--info)} .pricenow .list{border:1.5px solid var(--info)}
.row.price{background:var(--info-bg);align-items:flex-start}
.row.price .sub{overflow-wrap:anywhere}
.row.price .go{font-weight:700;text-decoration:underline;white-space:nowrap}
.row .go{font-weight:700;text-decoration:underline;white-space:nowrap}
.banner.ok{border-color:var(--ok);color:var(--ok)}
.msgl{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)} .msgl:first-child{border-top:0}
.msgl p{margin:0} .msgtext{white-space:pre-wrap;font:inherit;margin:6px 0 0;padding:10px;border:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere}
.payl{padding:8px 0;border-top:1px solid var(--line)} .payl p{margin:2px 0 0} .payl.void .ln-top{text-decoration:line-through;opacity:.6}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.row.static.act:hover{background:var(--bad-bg)}
.row.cut{align-items:flex-start}
.cutlen{flex:0 0 auto;min-width:96px;text-align:center;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.cutlen b{display:block;font-family:var(--font-display);font-size:24px;line-height:1.15} .cutlen small{display:block;font-size:11px;color:var(--muted)}
.row.cut.held .cutlen{opacity:.55}
.accitem{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)} .accitem:first-child{border-top:0;padding-top:0}
.accitem .st{margin:0;font-weight:600} .accitem .st.ok{color:var(--ok)} .accitem .st.bad{color:var(--bad)}
.accitem .lenrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .accitem .lenrow .in{width:120px}
.row.act .why{margin:4px 0 2px;font-weight:600;overflow-wrap:anywhere}
.actnone{margin:0;color:var(--muted);font-size:13px} .actnone b{color:var(--ink);margin-right:6px}
.card.backcard{border-color:var(--bad);background:var(--bad-bg)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.static{cursor:default} .row.static:hover{background:none}
.dateblk{flex:none;width:52px;text-align:center;font-family:var(--font-display);line-height:1}
.dateblk b{display:block;font-size:26px} .dateblk small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dateblk.none b{font-size:15px;color:var(--warn)} .dateblk.late b{color:var(--bad)}
.row .who{font-weight:700;overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row .end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:2px}

.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;border:1.5px solid var(--line);background:var(--surface)}
.banner.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.banner.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.banner.info{border-color:var(--info);background:var(--info-bg);color:var(--info)}
.banner p{margin:0}

/* diary */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:120px;display:flex;flex-direction:column;min-width:0}
.day.today{border-color:var(--ink);border-width:2px}
.day > header{padding:7px 9px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:6px}
.day > header small{font-family:var(--font-body);font-weight:600;font-size:12px;color:var(--muted)}
.dj{appearance:none;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;width:100%}
.dj:first-of-type{border-top:0}
.dj:hover{background:var(--sunk)}
.dj b{overflow-wrap:anywhere}
.dj.pencil{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--sunk) 8px 16px)}
.dj .sub{font-size:12px;color:var(--muted)}

/* stock */
.stk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stk-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.figs{display:flex;gap:16px;flex-wrap:wrap}
.fig b{display:block;font-family:var(--font-display);font-size:26px;line-height:1}
.fig small{font-size:12px;color:var(--muted);font-weight:600}
.fig.low b{color:var(--bad)}

/* job sheet */
#sheet{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(680px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.panel-head{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start}
.panel-body{flex:1;overflow-y:auto;padding-block:14px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card > h3{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.kv dt{color:var(--muted);font-size:13px} .kv dd{margin:0;overflow-wrap:anywhere;user-select:all}
.ln{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.ln:first-of-type{border-top:0;padding-top:0}
.ln-top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.ln-top b{overflow-wrap:anywhere}
.ln-top .num{white-space:nowrap}
.ticks{display:flex;gap:14px;flex-wrap:wrap}
.tick{display:inline-flex;gap:7px;align-items:center;font-weight:600;min-height:36px;cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--ok)}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}

/* dialogs and toast */

<script>
/* ---------- rules and sums (no screen code in here, so it can be tested on its own) ---------- */
window.IFDLogic = (function(){
  'use strict';
  var STORE_DOMAIN = 'innovationflooring.myshopify.com';
  var ADMIN = 'https://admin.shopify.com/store/innovationflooring';
  var TYPES = ['Fitting','Delivery','Collection'];
  var DONE_WORD = {Fitting:'Fitted', Delivery:'Delivered', Collection:'Collected'};

  function gidNum(g){ var m = /(\d+)\s*$/.exec(String(g == null ? '' : g)); return m ? m[1] : ''; }
  function variantGid(n){ var d = gidNum(n); return d ? 'gid://shopify/ProductVariant/' + d : ''; }
  function round2(n){ return Math.round((Number(n) || 0) * 100) / 100 || 0; }      /* never minus nought */
  function money(n){ var v = round2(n); return (v < 0 ? '-' : '') + '£' + Math.abs(v).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function parseMoney(s){ if (typeof s === 'number') return s; var m = /-?[\d,]+(?:\.\d+)?/.exec(String(s == null ? '' : s)); return m ? Number(m[0].replace(/,/g, '')) : 0; }

  /* dates are plain YYYY-MM-DD strings in shop time */
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function isoOf(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO(){ return isoOf(new Date()); }
  function dateOf(iso){ var p = String(iso).split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12); }
  function validISO(iso){ return /^\d{4}-\d{2}-\d{2}$/.test(String(iso || '')); }
  function addDays(iso, n){ var d = dateOf(iso); d.setDate(d.getDate() + n); return isoOf(d); }
  function daysBetween(a, b){ return Math.round((dateOf(b) - dateOf(a)) / 86400000); }
  function mondayOf(iso){ var d = dateOf(iso); var wd = (d.getDay() + 6) % 7; return addDays(iso, -wd); }
  function weekDays(iso){ var m = mondayOf(iso), out = []; for (var i = 0; i < 7; i++) out.push(addDays(m, i)); return out; }
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDay(iso){ if (!validISO(iso)) return 'No date'; var d = dateOf(iso); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function dayParts(iso){ var d = dateOf(iso); return {dow:DOW[d.getDay()], day:d.getDate(), mon:MON[d.getMonth()]}; }
  function parseLongDate(s){ /* "Wednesday 11 November 2026" */
    var m = /(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})/.exec(String(s || '')); if (!m) return '';
    var mi = MON.map(function(x){ return x.toLowerCase(); }).indexOf(m[2].toLowerCase()); if (mi < 0) return '';
    return m[3] + '-' + pad(mi + 1) + '-' + pad(Number(m[1]));
  }

  /* ----- reading what the Shopify connector hands back ----- */
  function isGql(v){ return !!v && typeof v === 'object' && !Array.isArray(v) && ('data' in v || 'errors' in v); }
  function balancedEnd(t, i){
    var depth = 0, inStr = false, esc = false;
    for (var j = i; j < t.length; j++){
      var c = t[j];
      if (inStr){ if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') inStr = true; else if (c === '{') depth++; else if (c === '}'){ depth--; if (depth === 0) return j; }
    }
    return -1;
  }
  function parseEmbeddedJson(t){
    if (typeof t !== 'string') return null;
    try { var whole = JSON.parse(t); if (isGql(whole)) return whole; } catch (e) {}
    var i = t.indexOf('{'), guard = 0;
    while (i !== -1 && guard++ < 60){
      var j = balancedEnd(t, i);
      if (j === -1) break;
      try { var v = JSON.parse(t.slice(i, j + 1)); if (isGql(v)) return v; } catch (e2) {}
      i = t.indexOf('{', i + 1);
    }
    return null;
  }
  function extractGraphQL(res){
    if (res == null) return null;
    if (typeof res === 'string') return parseEmbeddedJson(res);
    if (isGql(res)) return res;
    if (isGql(res.structuredContent)) return res.structuredContent;
    if (isGql(res.payload)) return res.payload;
    var texts = [];
    if (typeof res.payload === 'string') texts.push(res.payload);
    var blocks = Array.isArray(res.content) ? res.content : [];
    for (var b = 0; b < blocks.length; b++) if (blocks[b] && typeof blocks[b].text === 'string') texts.push(blocks[b].text);
    if (typeof res.message === 'string') texts.push(res.message);
    for (var k = 0; k < texts.length; k++){ var got = parseEmbeddedJson(texts[k]); if (got) return got; }
    return null;
  }
  function userErrorsOf(data){
    var out = [];
    if (data && typeof data === 'object') Object.keys(data).forEach(function(k){ var v = data[k]; if (v && Array.isArray(v.userErrors)) out = out.concat(v.userErrors); });
    return out;
  }

  /* ----- stock figures for one Shopify variant ----- */
  function levelFigures(variant){
    var lv = (variant && variant.inventoryItem && variant.inventoryItem.inventoryLevels && variant.inventoryItem.inventoryLevels.nodes) || [];
    var total = {available:0, on_hand:0, committed:0, reserved:0}, per = [];
    lv.forEach(function(n){
      var q = {available:0, on_hand:0, committed:0, reserved:0};
      (n.quantities || []).forEach(function(x){ if (x.name in q) q[x.name] = Number(x.quantity) || 0; });
      per.push({id:n.location.id, name:n.location.name, available:q.available, on_hand:q.on_hand, committed:q.committed, reserved:q.reserved});
      total.available += q.available; total.on_hand += q.on_hand; total.committed += q.committed; total.reserved += q.reserved;
    });
    return {total:total, per:per, tracked: !!(variant && variant.inventoryItem && variant.inventoryItem.tracked)};
  }
  function isRoll(variant, product){
    return !!(variant && variant.rollWidth && variant.rollWidth.value) || !!(product && product.productType === 'Carpet roll');
  }
  function unitFor(variant, product){
    if (isRoll(variant, product)) return 'm';
    if (product && product.coverage && product.coverage.value) return 'packs';
    return 'items';
  }
  /* a roll is stocked in 10cm units: 286 units is 28.6 m */
  function fmtQty(qty, unit){
    var q = Number(qty) || 0;
    if (unit === 'm') return (q / 10).toFixed(1) + ' m';
    if (unit === 'packs') return q + (q === 1 ? ' pack' : ' packs');
    if (unit === 'm²') return round2(q) + ' m²';
    if (unit === 'metres') return round2(q) + ' m';
    if (unit === 'rolls' || unit === 'boxes' || unit === 'lengths' || unit === 'tubs'){ var one = {rolls:'roll', boxes:'box', lengths:'length', tubs:'tub'}[unit]; return q + ' ' + (q === 1 ? one : unit); }
    return String(q);
  }
  function ppmOf(product){ try { return Number(JSON.parse(product.ppm.value).amount) || 0; } catch (e) { return 0; } }
  function rollPrice(widthM, lengthM, pricePerM2){ return round2((Number(widthM) || 0) * (Number(lengthM) || 0) * (Number(pricePerM2) || 0)); }

  /* ----- jobs ----- */
  function linesOf(job){
    var o = (job && job.lines) || {};
    return Object.keys(o).map(function(k){ var l = Object.assign({k:k}, o[k]); return l; })
      .filter(function(l){ return !l.gone; })
      .sort(function(a, b){ return (a.n || 0) - (b.n || 0); });
  }
  function stockLines(job){ return linesOf(job).filter(function(l){ return l.hold && l.hold !== 'none'; }); }
  function payList(job){ var p = (job && job.pay) || {}; return Object.keys(p).map(function(k){ return Object.assign({k:k}, p[k]); }).sort(function(a, b){ return String(a.at).localeCompare(String(b.at)); }); }
  function paidOf(job){ return round2(payList(job).reduce(function(s, e){ if (e.void) return s; var a = Number(e.amount) || 0; return s + (e.kind === 'refund' ? -a : a); }, 0)); }
  /* the fitting total is paid by the customer straight to the fitter when the job is finished, so the shop never collects it */
  function fitterDue(job){ var n = job && job.type === 'Fitting' ? num(job.fitterDue) : 0; return round2(Math.min(n, Number(job && job.total) || 0)); }
  function balanceOf(job){ return round2((Number(job && job.total) || 0) - fitterDue(job) - paidOf(job)); }
  /* what the shop itself sells and collects: the job total less the fitting money that goes straight to the fitter */
  function shopTotal(job){ return round2((Number(job && job.total) || 0) - fitterDue(job)); }
  function creditOf(job){ var b = balanceOf(job); return b < -0.004 ? round2(-b) : 0; }
  /* the fitter's money never goes through the shop's ledger. The shop only notes whether the customer has paid the fitter. */
  function fitterPaid(job){ return !!(job && job.fitterPaid && job.fitterPaid.at); }
  function fitterOwed(job){ var fd = fitterDue(job); return fd > 0 && !fitterPaid(job) ? fd : 0; }
  function owedText(job){ var b = balanceOf(job); return b > 0.004 ? money(b) + ' still to pay the shop' : b < -0.004 ? 'The customer is ' + money(-b) + ' in credit' : 'Nothing more to pay the shop'; }
  function receiptSubject(job, shop){ return 'Your receipt from ' + shop.name + (job.ref ? ', ref ' + job.ref : ''); }
  function receiptText(job, shop){ var bal = balanceOf(job); return shop.name + ': receipt' + (job.ref ? ' for ' + job.ref : '') + '. Paid to the shop so far: ' + money(paidOf(job)) + '. ' + (bal > 0.004 ? 'Still to pay the shop: ' + money(bal) + '.' : bal < -0.004 ? 'In credit: ' + money(-bal) + '.' : 'Nothing more to pay the shop.') + ' Questions: ' + shop.phone + '.'; }
  function receiptMessage(job, shop){
    var first = firstName((job.customer || {}).name), live = payList(job).filter(function(e){ return !e.void; }), fd = fitterDue(job), bal = balanceOf(job);
    var out = ['Hi ' + (first || 'there') + ',', '', 'Thank you. Here is your receipt from ' + shop.name + '.', '', 'Reference: ' + (job.ref || ''), ''];
    live.forEach(function(e){ out.push(fmtDay(stampDay(e.at)) + ': ' + (e.kind === 'refund' ? 'refunded ' : 'paid ') + money(e.amount) + (e.method ? ' by ' + String(e.method).toLowerCase() : '')); });
    out.push('', 'Paid to ' + shop.name + ' so far: ' + money(paidOf(job)));

async function makeJobFromOrder(o){
  if (!needDb()) return;
  const id = 'o' + L.gidNum(o.id), job = L.orderToJob(o, nowISO());
  try { await createJob(id, job, 'Job made from website order ' + o.name); toast('Job made for ' + job.customer.name); openSheet(id); fillCoverage(id, job, true); }
  catch (e){ dbFail(e); }
}
/* how much floor a pack covers, read from Shopify so the measured floor can be compared with the order */
async function fillCoverage(id, job, quiet){
  if (!shopOK()){ if (!quiet) needShop(); return; }
  const need = L.linesOf(job).filter(l => l.variantId && l.unit === 'packs' && !(Number(l.cov) > 0));
  if (!need.length) return;
  try {
    const d = await sq(Q_VARIANTS, {ids:Array.from(new Set(need.map(l => l.variantId)))}), by = {}, p = {lines:{}}; let any = 0;
    (d.nodes || []).forEach(v => { if (v) by[v.id] = v; });
    need.forEach(l => { const v = by[l.variantId], c = v && v.product && v.product.coverage ? Number(v.product.coverage.value) : 0; if (c > 0){ p.lines[l.k] = {cov:c}; any++; } });
    if (any) await patchJob(id, p);
    if (!quiet) toast(any ? 'Pack sizes read from Shopify' : 'Shopify has no pack coverage for these products.', !any);
  } catch (e){ if (!quiet) toast(explain(e), true); }
}

  const say = (text, bad) => { box.replaceChildren(); if (text) box.append(h('div', {class:'banner ' + (bad ? 'bad' : 'info')}, bad ? null : h('span', {class:'spin'}), h('p', {class:'grow', text:text}))); };
  return {box:box, say:say};
}
function isStale(e){ return !!(e && e.codes && e.codes.indexOf('CHANGE_FROM_QUANTITY_STALE') !== -1); }
function bayPicker(id, current, blankLabel){
  if (!S.bays.length) return h('input', {class:'in', id:id, type:'text', placeholder:'Bay code, for example W4-03', value:current || ''});
  const sel = h('select', {class:'in', id:id}, h('option', {value:'', text:blankLabel || 'Choose a bay'}));
  const all = S.bays.slice(); if (current && all.indexOf(current) === -1) all.unshift(current);
  all.forEach(b => sel.append(h('option', {value:b, text:b, selected:b === current})));
  return sel;
}
function locPicker(id, per){
  const sel = h('select', {class:'in', id:id});
  per.forEach(p => sel.append(h('option', {value:p.id, text:p.name + ' (' + p.available + ' free)'})));
  return sel;
}
async function freshVariant(id){
  const d = await sq(Q_VARIANTS, {ids:[id]});
  const v = (d.nodes || []).filter(Boolean)[0];
  if (!v) throw {code:'gone', message:'That product is no longer in Shopify.'};
  return v;
}
function variantTitle(p, v){ return p.title + (v.title && v.title !== 'Default Title' ? ' · ' + v.title : ''); }

/* ---------- Stock ---------- */
function setHomeBay(num, bay){ return S.cap.db.doc('bays/' + num).set({bay:bay, at:nowISO(), by:S.me.id || ''}); }
function bayDialog(p, v){
  if (!needDb()) return;
  const num = L.gidNum(v.id), cur = (S.homeBays.get(num) || {}).bay || '';
  const pick = bayPicker('homeBay', cur, 'No bay');
  openModal(dlg('Where is it kept?', h('div', {class:'sec'}, h('p', {class:'muted', text:variantTitle(p, v)}), field('Bay', pick)),
    [btn('Cancel', closeModal), btn('Save bay', async () => {
      try { await setHomeBay(num, String(pick.value || '').trim().toUpperCase()); logDay('Bay for ' + variantTitle(p, v) + ' set to ' + (pick.value || 'none')); closeModal(); toast('Bay saved'); }
      catch (e){ dbFail(e); }
    }, 'pri')], true));
}
function receiveDialog(p, v){
  if (!needShop() || !needDb()) return;
  const fig = L.levelFigures(v), unit = L.unitFor(v, p), num = L.gidNum(v.id), key = uid(), title = variantTitle(p, v);
  const qty = h('input', {class:'in', id:'rcvQty', type:'number', min:'1', step:'1', inputmode:'numeric', placeholder:'How many ' + (unit === 'packs' ? 'packs' : 'items')});
  const loc = locPicker('rcvLoc', fig.per), bay = bayPicker('rcvBay', (S.homeBays.get(num) || {}).bay || '', 'Leave the bay as it is');
  const s = sayer();
  const go = btn('Add to stock', async () => {
    const n = parseInt(qty.value, 10);
    if (!(n > 0)){ s.say('Enter how many arrived.', true); return; }
    go.disabled = true; s.say('Adding to Shopify stock');
    try {
      const fresh = await freshVariant(v.id), lv = L.levelFigures(fresh).per.find(x => x.id === loc.value);
      if (!lv) throw {code:'x', message:'Shopify does not stock this product at that location.'};
      await sm(M_ADJUST('rcv-' + key + '-' + lv.available + '-' + n), {input:{name:'available', reason:'received', changes:[{inventoryItemId:fresh.inventoryItem.id, locationId:lv.id, delta:n, changeFromQuantity:lv.available}]}});
      const b = String(bay.value || '').trim().toUpperCase(); if (b) await setHomeBay(num, b).catch(() => {});
      logDay('Received ' + L.fmtQty(n, unit) + ' of ' + title + ' into ' + lv.name + (b ? ', bay ' + b : ''));
      closeModal(); toast('Added to Shopify stock'); if (S.runStockSearch) S.runStockSearch();
    } catch (e){ go.disabled = false; s.say(isStale(e) ? 'The stock figure changed in Shopify while you were typing. Press the button again.' : explain(e, true), true); }
  }, 'pri');
  openModal(dlg('Receive a delivery', h('div', {class:'sec'}, h('p', {class:'muted', text:title + '. Use this for stock anyone can buy. Goods ordered in for one customer are booked in on their job instead.'}),
    h('div', {class:'grid2'}, field('Arrived', qty), field('Shopify location', loc)), field('Put away in bay', bay), s.box), [btn('Cancel', closeModal), go]));
}
function countDialog(p, v){
  if (!needShop() || !needDb()) return;
  const fig = L.levelFigures(v), unit = L.unitFor(v, p), key = uid(), title = variantTitle(p, v);
  const m = L.shelfMaths(v.id, jobsArr()), primary = fig.per[0] ? fig.per[0].id : '';
  const qty = h('input', {class:'in', id:'cntQty', type:'number', min:'0', step:'1', inputmode:'numeric', placeholder:'What is physically there'});
  const loc = locPicker('cntLoc', fig.per), sums = h('p', {class:'small muted'}), s = sayer();
  function plan(level, counted){
    const usesJobs = level.id === primary;
    const onHand = usesJobs ? L.countToOnHand(counted, m) : counted;
    return {usesJobs:usesJobs, onHand:onHand, free:onHand - (level.on_hand - level.available)};
  }
  function show(){
    const n = parseInt(qty.value, 10), lv = fig.per.find(x => x.id === loc.value);
    if (!lv || !(n >= 0)){ sums.textContent = 'Count everything on the shelf, including goods set aside for customers.'; return; }
    const pl = plan(lv, n);
    sums.textContent = 'Counted ' + n + (pl.usesJobs ? ', less ' + (m.heldWeb + m.heldSupplier) + ' set aside outside Shopify, plus ' + m.gone + ' already gone on finished jobs' : '') + ', less ' + (lv.on_hand - lv.available) + ' reserved in Shopify. Free to sell becomes ' + pl.free + '.';
  }
  qty.addEventListener('input', show); loc.addEventListener('change', show); show();
  const go = btn('Set stock in Shopify', async () => {
    const n = parseInt(qty.value, 10);
    if (!(n >= 0)){ s.say('Enter what you counted.', true); return; }
    go.disabled = true; s.say('Updating Shopify');
    try {
      const fresh = await freshVariant(v.id), lv = L.levelFigures(fresh).per.find(x => x.id === loc.value);
      if (!lv) throw {code:'x', message:'Shopify does not stock this product at that location.'};
      const pl = plan(lv, n);
      if (pl.free < 0) throw {code:'x', message:'That count is less than what is already promised to customers. Count again, or sort the jobs first.'};
      await sm(M_SET('cnt-' + key + '-' + lv.available + '-' + pl.free), {input:{name:'available', reason:'cycle_count_available', quantities:[{inventoryItemId:fresh.inventoryItem.id, locationId:lv.id, quantity:pl.free, changeFromQuantity:lv.available}]}});
      logDay('Counted ' + title + ' at ' + lv.name + ': ' + L.fmtQty(n, unit) + ' on the shelf, free to sell set to ' + pl.free);
      closeModal(); toast('Shopify stock updated'); if (S.runStockSearch) S.runStockSearch();
    } catch (e){ go.disabled = false; s.say(isStale(e) ? 'The stock figure changed in Shopify while you were typing. Press the button again.' : explain(e, true), true); }
  }, 'pri');
  openModal(dlg('Count this product', h('div', {class:'sec'}, h('p', {class:'muted', text:title}),
    h('div', {class:'grid2'}, field('Counted on the shelf', qty), field('Shopify location', loc)), sums, s.box), [btn('Cancel', closeModal), go]));
}
function stockCard(p, v){
  const fig = L.levelFigures(v), roll = L.isRoll(v, p), unit = L.unitFor(v, p), num = L.gidNum(v.id);
  const m = L.shelfMaths(v.id, jobsArr()), home = (S.homeBays.get(num) || {}).bay || '';
  const held = m.heldWeb + m.heldSupplier, expected = L.expectedOnShelf(fig.total.on_hand, m);
  const figs = h('div', {class:'figs'});
  const fig1 = (n, label, low) => h('div', {class:'fig' + (low ? ' low' : '')}, h('b', {class:'num', text:unit === 'm' ? (n / 10).toFixed(1) : String(n)}), h('small', {text:label}));
  if (fig.tracked){
    figs.append(fig1(fig.total.available, unit === 'm' ? 'metres free to sell' : 'free to sell', fig.total.available <= 0));
    if (fig.total.on_hand - fig.total.available) figs.append(fig1(fig.total.on_hand - fig.total.available, 'reserved in Shopify'));
    if (held) figs.append(fig1(held, 'set aside for jobs'));
    figs.append(fig1(expected, 'should be on the shelf'));
  }
  const tags = h('div', {class:'meta'});
  if (roll){
    if (v.rollNumber && v.rollNumber.value) tags.append(chip('Roll ' + v.rollNumber.value));
    if (v.rollWidth && v.rollWidth.value) tags.append(chip(Number(v.rollWidth.value) + 'm wide'));
    if (v.rollStatus && v.rollStatus.value) tags.append(chip(v.rollStatus.value, v.rollStatus.value === 'Available' ? 'ok' : 'info'));
    if (v.rollLocation && v.rollLocation.value) tags.append(bayTag(v.rollLocation.value));
  } else {
    tags.append(home ? bayTag(home) : chip('No bay set', 'warn'));
    tags.append(chip(unit === 'packs' ? 'Sold by the pack' : 'Sold singly'));
  }
  if (fig.per.length > 1) fig.per.forEach(x => tags.append(chip(x.name + ': ' + (unit === 'm' ? (x.available / 10).toFixed(1) + ' m' : x.available))));
  const forJobs = m.forJobs.length ? h('p', {class:'small muted', text:'For jobs: ' + m.forJobs.map(f => f.ref + ' ' + (f.name || '') + ' (' + L.fmtQty(f.qty, unit) + ')').join(', ')}) : null;
  let actions;
  if (!fig.tracked) actions = h('div', {class:'bar'}, chip('Shopify is not tracking stock for this', 'warn'), adminLink('products', p.id, 'Open in Shopify'), roll ? null : btn('Set bay', () => bayDialog(p, v), 'sm'));
  else if (roll) actions = h('p', {class:'small muted', text:'Rolls are received and cut on the carpet stock screens. A cut sold here is reserved against the roll straight away.'});
  else actions = h('div', {class:'bar'}, btn('Receive', () => receiveDialog(p, v), 'sm'), btn('Count', () => countDialog(p, v), 'sm'), btn('Set bay', () => bayDialog(p, v), 'sm'));
  return h('div', {class:'stk'}, h('div', {class:'stk-top'}, h('div', {class:'grow'}, h('h3', {text:variantTitle(p, v)}), tags), figs), forJobs, actions);
}
VIEWS.stock = function(){
  const out = h('div', {style:'display:contents'});
  const input = h('input', {class:'in', id:'stockSearch', type:'search', placeholder:'Product name, or a roll number like R-901', value:S.ui.stockQ,
    oninput:e => { S.ui.stockQ = e.target.value; }, onkeydown:e => { if (e.key === 'Enter') run(); }});
  async function run(){
    if (!needShop()) return;
    const q = L.productQuery(S.ui.stockQ); if (!q) return;
    S.ui.stockBusy = true; S.ui.stockMsg = ''; draw();
    try {
      let d = await sq(Q_SEARCH, {q:q}), ps = (d.products && d.products.nodes) || [];
      if (!ps.length){ d = await sq(Q_SEARCH, {q:S.ui.stockQ.trim() + ' status:active'}); ps = (d.products && d.products.nodes) || []; }
      S.ui.stock = ps;
    } catch (e){ S.ui.stockMsg = explain(e); }
    S.ui.stockBusy = false; draw();
  }
  S.runStockSearch = run;
  function draw(){
    out.replaceChildren(); add(out, banners());
    if (S.ui.stockBusy){ out.append(h('div', {class:'banner info'}, h('span', {class:'spin'}), h('p', {text:'Reading live stock from Shopify'}))); return; }
    if (S.ui.stockMsg) out.append(h('div', {class:'banner warn'}, h('p', {text:S.ui.stockMsg})));
    if (S.ui.stock == null){ out.append(h('div', {class:'list'}, h('div', {class:'empty'}, h('b', {text:'Search to see live stock'}), 'Figures come straight from Shopify each time. This page keeps no stock numbers of its own.'))); return; }
    if (!S.ui.stock.length){ out.append(h('div', {class:'list'}, h('div', {class:'empty'}, h('b', {text:'Nothing found'}), 'Try fewer words, or the start of the product name.'))); return; }
    S.ui.stock.forEach(p => ((p.variants && p.variants.nodes) || []).forEach(v => out.append(stockCard(p, v))));
  }
  return {nodes:[
    h('div', {class:'head'}, h('div', {}, h('h1', {text:'Stock'}), h('p', {text:'Live from Shopify, with what is set aside for jobs and where it is kept.'})), btn('Opening stocktake', () => go('stocktake'), 'sm')),
    h('div', {class:'bar'}, h('div', {class:'grow'}, input), btn('Search', run, 'pri')), out], refresh:draw};
};

/* ---------- Tasks ---------- */
function taskRow(t){
  const late = !t.done && t.due && t.due < L.todayISO();
  return h('div', {class:'row static'},
    h('label', {class:'tick grow'}, h('input', {type:'checkbox', checked:!!t.done, onchange:e => { S.cap.db.doc('tasks/' + t.id).update({done:e.target.checked, doneAt:e.target.checked ? nowISO() : '', doneBy:S.me.id || ''}).catch(dbFail); }}),
      h('span', {style:t.done ? 'text-decoration:line-through' : '', text:t.text})),
    t.due ? chip(L.fmtDay(t.due), late ? 'bad' : '') : null,
    t.done ? btn('Remove', () => { S.cap.db.doc('tasks/' + t.id).delete().catch(dbFail); }, 'sm') : null);
}
VIEWS.tasks = function(){
  const list = h('div', {style:'display:contents'});
  const text = h('input', {class:'in', id:'taskText', type:'text', placeholder:'Call Mrs Phillips back about delivery', onkeydown:e => { if (e.key === 'Enter') addTask(); }});
  const due = h('input', {class:'in', id:'taskDue', type:'date', value:L.todayISO()});
  async function addTask(){
    const v = text.value.trim(); if (!v || !needDb()) return;
    try { await S.cap.db.collection('tasks').add({text:v, due:due.value || '', done:false, at:nowISO(), by:S.me.id || ''}); text.value = ''; }
    catch (e){ dbFail(e); }
  }
  function draw(){
    const open = S.tasks.filter(t => !t.done).sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')));
    const done = S.tasks.filter(t => t.done).sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt))).slice(0, 20);
    list.replaceChildren(
      h('section', {class:'sec'}, h('h2', {}, 'To do', h('span', {text:String(open.length)})), listOf(open.map(taskRow), 'Nothing to do', 'Add the small things here so they are not kept in someone’s head.')),
      done.length ? h('section', {class:'sec'}, h('h2', {}, 'Done'), listOf(done.map(taskRow), '', '')) : null);
  }
  return {nodes:[h('div', {class:'head'}, h('h1', {text:'Tasks'})),
    h('div', {class:'bar'}, h('div', {class:'grow', style:'min-width:200px'}, text), h('div', {style:'min-width:150px'}, due), btn('Add task', addTask, 'pri')), list], refresh:draw};
};

/* ---------- Activity ---------- */
VIEWS.activity = function(){
  const list = h('div', {style:'display:contents'});
  function draw(){
    const rows = [];
    jobsArr().forEach(j => Object.keys(j.log || {}).forEach(k => rows.push(Object.assign({job:j}, j.log[k]))));
    S.activity.forEach(d => Object.keys(d.items || {}).forEach(k => rows.push(d.items[k])));
    rows.sort((a, b) => String(b.at).localeCompare(String(a.at)));
    const top = rows.slice(0, 150);
    learnNames(Array.from(new Set(top.map(r => r.by))));
    list.replaceChildren(listOf(top.map(r => h(r.job ? 'button' : 'div', {type:r.job ? 'button' : null, class:'row' + (r.job ? '' : ' static'), onclick:r.job ? () => openSheet(r.job.id) : null},
      h('div', {class:'grow'}, h('div', {text:r.text}), h('div', {class:'sub', text:whenText(r.at) + ' · ' + nameOf(r.by) + (r.job ? ' · ' + ((r.job.customer || {}).name || '') + ' ' + r.job.ref : '')})))),
      'Nothing logged yet', 'Every allocation, payment, stock change and completed job is listed here with who did it.'));
  }
  return {nodes:[h('div', {class:'head'}, h('div', {}, h('h1', {text:'Activity'}), h('p', {text:'The last 150 things anyone did.'}))), list], refresh:draw};
};

/* ---------- the fitter's own page ----------
   Their diary, their jobs, the days they cannot work. No prices, no payments, nobody else's work.
   Until each fitter has a login of their own this opens from the shop's screen as a preview. */
function fitterEntries(person){
  const out = [];
  openJobs().forEach(j => {
    if (j.fitter === person && L.validISO(j.date) && L.linesOf(j).length && j.type !== 'Collection') out.push({job:j, v:null, date:j.date, slot:j.slot || '', label:j.ret === 'booked' ? 'Return visit' : j.type, firm:j.diary === true});
    L.preOf(j).forEach(v => { if (v.who === person && v.status === 'booked' && L.validISO(v.date)) out.push({job:j, v:v, date:v.date, slot:v.slot || '', label:L.PRE_KINDS[v.kind], firm:true}); });
  });
  const rank = {AM:'1', '':'2', PM:'3'};
  return out.sort((a, b) => (a.date + (rank[a.slot] || '2')).localeCompare(b.date + (rank[b.slot] || '2')));
}
/* everything waiting on one estimator, in the order it needs doing */
function estimatorLoad(who){
  const t = L.todayISO(), ld = {urgent:[], late:[], today:[], week:[], ring:[], shop:[]};
  openJobs().forEach(j => {
    L.toArrange(j).forEach(v => { if (v.who === who) ld.urgent.push({job:j, v:v}); });
    if (j.review && j.review.on && j.review.sentBy === who) ld.shop.push(j);
  });
  fitterEntries(who).forEach(x => {
    const d = L.daysBetween(t, x.date);
    if (d < 0) ld.late.push(x); else if (d === 0) ld.today.push(x); else if (d <= 7) ld.week.push(x);
    const st = x.v ? L.preArrivalState(x.v, t) : x.firm ? L.arrivalState(x.job, t) : 'na';
    if (st === 'overdue' || st === 'soon') ld.ring.push(x);
  });
  ld.waiting = ld.urgent.length + ld.late.length + ld.ring.length;
  return ld;
}
function estimatorLine(ld){
  const n = (k, one, many) => k + ' ' + (k === 1 ? one : many), out = [];
  if (ld.urgent.length) out.push(n(ld.urgent.length, 'measure to arrange', 'measures to arrange'));
  if (ld.late.length) out.push(n(ld.late.length, 'set of findings owed', 'sets of findings owed'));
  if (ld.ring.length) out.push(n(ld.ring.length, 'customer to ring', 'customers to ring'));
  out.push(ld.today.length ? n(ld.today.length, 'visit today', 'visits today') : 'nothing today');
  out.push(ld.week.length ? n(ld.week.length, 'visit in the next 7 days', 'visits in the next 7 days') : 'nothing booked in the next 7 days');
  if (ld.shop.length) out.push(n(ld.shop.length, 'job sent back to the shop', 'jobs sent back to the shop'));
  return out.join(' · ');
}

/* ---------- a new sale, or more items for a job ---------- */
function gbp(n){ return {amount:L.round2(n).toFixed(2), currencyCode:'GBP'}; }
/* a cut off a roll: priced on the carpet ordered (roll width × cut length × the price per m²), or, for a roll that carries

function rollCost(l, lenM){
  const len = Math.ceil(Number(lenM) * 10 - 1e-9) / 10; if (!(len > 0)) return 0;
  return l.ppm > 0 ? L.rollPrice(l.widthM, len, l.ppm) : l.unitPrice > 0 ? L.round2(Math.round(len * 10) * l.unitPrice) : 0;
}
function unitsOf(l){ return l.roll ? Math.ceil(Number(l.qty) * 10 - 1e-9) : (parseInt(l.qty, 10) || 0); }
function lineTotal(l){
  if (l.acc) return L.round2(l.price);

  return l.roll ? L.round2(l.price) : L.round2((Number(l.price) || 0) * unitsOf(l));

function draftInput(ctx, tag){

async function reserveInShopify(ctx, say, always){

  const ids = Object.keys(need);

    (d.nodes || []).forEach(n => { if (n) by[n.id] = n; });
    for (const id of ids){
      const l = stock.find(x => x.variantId === id), v = by[id];
      if (!v) throw {user:l.title + ' is no longer in Shopify.'};
      const f = L.levelFigures(v);
      if (!f.tracked) throw {user:'Shopify is not tracking stock for ' + l.title + '. ' + (l.acc ? 'Choose “Not a Shopify stock item” for it.' : 'Switch that line to Order in.')};
      if (f.total.available < need[id]) throw {user:'Only ' + L.fmtQty(Math.max(0, f.total.available), l.unit) + ' of ' + l.title + ' is free in Shopify. ' + (l.acc ? 'Lower the number, or choose “Not a Shopify stock item” for it.' : 'Lower the quantity or switch that line to Order in.')};
    }

    await sleep(1500); let found;
    try { const d = await sq(Q_DRAFT_TAG, {q:'tag:' + tag}); found = d.draftOrders.nodes[0]; }
    catch (e2){ throw {user:'Shopify did not answer. Before trying again, look in Shopify under Orders, Drafts for one tagged ' + tag + '.'}; }

    draft = found;

    say('Checking nothing was sold twice');
    let over = null;
    try { const d = await sq(Q_VARIANTS, {ids:ids}); (d.nodes || []).forEach(n => { if (n && !over && L.levelFigures(n).total.available < 0) over = n; }); }
    catch (e){ return {draft:draft, warn:'Saved, but the last stock check could not run. Look at the stock figure in Shopify.'}; }
    if (over){
      const l = stock.find(x => x.variantId === over.id) || stock[0];
      try { await sm(M_DRAFT_DELETE, {input:{id:draft.id}}); }
      catch (e){ throw {user:'Someone took the last of ' + l.title + ' at the same moment, and draft ' + draft.name + ' could not be removed. Delete that draft in Shopify now.'}; }
      throw {user:'Someone took the last of ' + l.title + ' at the same moment. Nothing has been reserved. Check the stock and try again.'};

}

  const wOf = v => Number(v.rollWidth && v.rollWidth.value) || 0, free = v => L.levelFigures(v).total.available, same = v => Math.abs(wOf(v) - w) < 0.01;

  o.lines[nk] = {n:top, variantId:l.variantId, title:l.title, sub:l.sub || '', unit:l.unit, qty:n, jobId:j.id, jobLine:jl.k, jobRef:j.ref || '', jobName:(j.customer || {}).name || '', kind:(jl.hold === 'supplier' || jl.hold === 'reserved') ? 'reserved' : 'available'};
  try {
    await patchDoc('deliveries/' + d.id, o);
    const p = {lines:{}}; p.lines[jl.k] = {state:L.supplyOf(jl).got > 0 ? 'part' : 'ordered', supplier:d.supplier, due:d.expected, deliveryId:d.id};
    await patchJob(j.id, p, L.fmtQty(n, l.unit) + ' of ' + l.title + ' on the ' + d.supplier + ' delivery set aside for this job');
    toast('Set aside for ' + ((j.customer || {}).name || 'the job'));
  } catch (e){ dbFail(e); }
}
function closeDeliveryDialog(d){
  const short = L.dLines(d).filter(l => L.dOutstanding(l) > 0);
  openModal(dlg('Nothing more is coming', h('div', {class:'sec'}, h('p', {text:short.length ? 'This closes the delivery with these still missing. Any job waiting for them goes back on the list to be ordered.' : 'Everything on this delivery has arrived. Close it?'}),
    short.length ? h('ul', {}, short.map(l => h('li', {text:L.fmtQty(L.dOutstanding(l), l.unit) + ' of ' + l.title + (l.jobId ? ' for ' + (l.jobName || '') + ' ' + (l.jobRef || '') : '')}))) : null),
    [btn('Keep it open', closeModal), btn('Close the delivery', async () => {
      try {
        await patchDoc('deliveries/' + d.id, {status:'closed', closedAt:nowISO(), closedBy:S.me.id || ''});
        for (const l of short){
          if (!l.jobId) continue;
          const job = S.jobs.get(l.jobId), jl = job && job.lines && job.lines[l.jobLine]; if (!jl) continue;
          const p = {lines:{}}; p.lines[l.jobLine] = {deliveryId:'', short:true, state:L.supplyOf(jl).got > 0 ? 'part' : 'ordered'};
          await patchJob(job.id, p, d.supplier + ' delivery closed short: ' + L.fmtQty(L.dOutstanding(l), l.unit) + ' of ' + l.title + ' still needed');
        }
        logDay('Delivery from ' + d.supplier + ' closed' + (short.length ? ' with shortages' : '')); closeModal();
      } catch (e){ dbFail(e); }
    }, 'pri')], true));
}
/* goods held in Shopify for a job are released when the job is finished and the goods have gone */
async function releaseHeld(jobId, loud){
  const job = S.jobs.get(jobId); if (!job) return;
  for (const l of L.linesOf(job)){
    if (l.hold !== 'reserved' || l.released) continue;
    const qty = L.supplyOf(l).got, p = {lines:{}};
    try {
      if (!shopOK()) throw {code:'x', message:'Shopify is not connected.'};
      const v = await freshVariant(l.variantId), per = L.levelFigures(v).per;
      if (typeof l.relFrom === 'number' && per.some(x => x.reserved === l.relFrom - qty) && !per.some(x => x.reserved === l.relFrom)){
        p.lines[l.k] = {released:true, releaseMsg:''}; await patchJob(jobId, p, 'Held stock for ' + l.title + ' confirmed as released in Shopify'); continue;
      }
      const lv = per.find(x => x.reserved >= qty);
      if (!lv) throw {code:'x', message:'Shopify does not show ' + L.fmtQty(qty, l.unit) + ' held for ' + l.title + '. Check the product in Shopify.'};
      const mark = {lines:{}}; mark.lines[l.k] = {relFrom:lv.reserved}; await patchJob(jobId, mark, null);
      await sm(M_ADJUST('rel-' + jobId + '-' + l.k + '-' + lv.reserved), {input:{name:'reserved', reason:'correction', changes:[{inventoryItemId:v.inventoryItem.id, locationId:lv.id, delta:-qty, changeFromQuantity:lv.reserved, ledgerDocumentUri:'gid://ifd-ops/Job/' + jobId}]}});
      p.lines[l.k] = {released:true, releaseMsg:''}; await patchJob(jobId, p, 'Released ' + L.fmtQty(qty, l.unit) + ' of ' + l.title + ' from held stock in Shopify');
    } catch (e){
      p.lines[l.k] = {releaseMsg:e.code === 'x' ? e.message : explain(e, true)};
      await patchJob(jobId, p, null).catch(() => {});
      if (loud) toast(p.lines[l.k].releaseMsg, true);
    }
  }
}

/* ---------- opening stocktake: a count sets Shopify's figure, it never adds to it ---------- */
VIEWS.stocktake = function(){
  const body = h('div', {style:'display:contents'});
  const U = {bay:'', pick:null, review:null, busy:false, msg:'', ack:false};
  const qty = h('input', {class:'in', id:'stQty', type:'number', min:'0', step:'1', inputmode:'decimal', placeholder:'Counted'});
  const picked = h('p', {class:'small muted', text:'Pick the bay, find the product, then enter what is physically there.'});
  const finder = productFinder('stFind', (p, v) => {
    U.pick = {variantId:v.id, title:variantTitle(p, v), unit:L.unitFor(v, p)};
    picked.textContent = 'Counting ' + U.pick.title + (U.pick.unit === 'm' ? '. Enter the measured length left on the roll, in metres.' : U.pick.unit === 'packs' ? '. Enter full packs.' : '.');
    qty.step = U.pick.unit === 'm' ? '0.1' : '1'; qty.value = ''; qty.focus();
  });
  const say = (text, bad) => { U.msg = text ? {text:text, bad:!!bad} : ''; draw(true); };
  async function start(){
    if (!needDb()) return;
    try { await queue('stocktake/main', () => S.cap.db.doc('stocktake/main').set({status:'counting', startedAt:nowISO(), by:S.me.id || '', applied:{}})); logDay('Opening stocktake started'); } catch (e){ dbFail(e); }
  }
  async function addCount(){
    const n = Number(qty.value);
    if (S.bays.indexOf(U.bay) === -1){ say('Choose the bay you are counting.', true); return; }
    if (!U.pick){ say('Search for the product first.', true); return; }
    if (qty.value === '' || !(n >= 0)){ say('Enter what you counted.', true); return; }
    const units = U.pick.unit === 'm' ? Math.round(n * 10) : Math.round(n);
    try {
      await S.cap.db.collection('counts').add({variantId:U.pick.variantId, title:U.pick.title, unit:U.pick.unit, bay:U.bay, qty:units, at:nowISO(), by:S.me.id || ''});
      U.pick = null; U.review = null; qty.value = ''; picked.textContent = 'Saved. Find the next product in ' + U.bay + ', or change bay.'; say('');
    } catch (e){ dbFail(e); }
  }
  async function runReview(){
    if (!needShop()) return;
    U.busy = true; say('');
    try {
      const by = new Map(), jobs = jobsArr();
      S.counts.forEach(c => { const r = by.get(c.variantId) || {variantId:c.variantId, title:c.title, unit:c.unit, counted:0, bays:{}}; r.counted += Number(c.qty) || 0; r.bays[c.bay] = (r.bays[c.bay] || 0) + (Number(c.qty) || 0); by.set(c.variantId, r); });
      const ids = Array.from(by.keys());
      for (let i = 0; i < ids.length; i += 40){
        const d = await sq(Q_VARIANTS, {ids:ids.slice(i, i + 40)});
        (d.nodes || []).forEach(v => { if (!v) return; const r = by.get(v.id), f = L.levelFigures(v); r.found = true; r.tracked = f.tracked; r.locs = f.per.length; r.fig = f.total; r.m = L.shelfMaths(v.id, jobs); r.plan = L.countPlan(r.counted, f.total, r.m); });
      }
      const uncounted = []; let after = null;
      for (let page = 0; page < 8; page++){
        const d = await sq(Q_STOCKED, {after:after}), pr = d.products;
        (pr.nodes || []).forEach(p => ((p.variants && p.variants.nodes) || []).forEach(v => { if (by.has(v.id) || !(v.inventoryItem && v.inventoryItem.tracked) || !(v.inventoryQuantity > 0)) return; uncounted.push({variantId:v.id, title:variantTitle(p, v), unit:L.unitFor(v, p), shopify:v.inventoryQuantity}); }));
        if (!pr.pageInfo || !pr.pageInfo.hasNextPage) break; after = pr.pageInfo.endCursor;
      }
      U.review = {rows:Array.from(by.values()), uncounted:uncounted};
      if (S.take && S.take.status === 'counting') await patchDoc('stocktake/main', {status:'review'});
    } catch (e){ U.busy = false; say(explain(e), true); return; }
    U.busy = false; draw(true);
  }
  async function apply(row, counted){
    if (!needShop() || U.busy) return;
    U.busy = true; say('');
    try {
      const v = await freshVariant(row.variantId), f = L.levelFigures(v), num = L.gidNum(row.variantId);
      if (!f.tracked) throw {code:'x', message:'Shopify is not tracking stock for ' + row.title + '. Turn tracking on for it in Shopify, then apply.'};
      if (f.per.length !== 1) throw {code:'x', message:row.title + ' is held in more than one Shopify location. Set that one in Shopify by hand.'};
      const lv = f.per[0], plan = L.countPlan(counted, lv, L.shelfMaths(row.variantId, jobsArr()));
      if (plan.conflict) throw {code:'x', message:'Fewer ' + row.title + ' are on the shelf than are promised to customers. Sort those jobs first, then apply.'};
      if (plan.free !== lv.available) await sm(M_SET('stk-' + num + '-' + lv.available + '-' + plan.free), {input:{name:'available', reason:'cycle_count_available', quantities:[{inventoryItemId:v.inventoryItem.id, locationId:lv.id, quantity:plan.free, changeFromQuantity:lv.available}]}});
      const a = {applied:{}}; a.applied[num] = {at:nowISO(), by:S.me.id || '', counted:counted, free:plan.free, was:lv.available};
      await patchDoc('stocktake/main', a);
      const bays = Object.keys(row.bays || {}).filter(L.isFinalBay).sort((x, y) => row.bays[y] - row.bays[x]);
      if (bays.length) await setHomeBay(num, bays[0]).catch(() => {});
      logDay('Stocktake: ' + row.title + ' counted ' + L.fmtQty(counted, row.unit) + '. Free to sell in Shopify ' + L.fmtQty(lv.available, row.unit) + ' to ' + L.fmtQty(plan.free, row.unit));
      row.fig = Object.assign({}, lv, {available:plan.free, on_hand:plan.onHand}); row.plan = Object.assign({}, plan, {change:0});
    } catch (e){ U.busy = false; say(isStale(e) ? 'Shopify’s figure for ' + row.title + ' changed since the review. Press Review again.' : e.code === 'x' ? e.message : explain(e, true), true); return; }
    U.busy = false; draw(true);
  }
  function isApplied(row){ const a = S.take && S.take.applied && S.take.applied[L.gidNum(row.variantId)]; return !!(a && a.counted === row.counted); }
  async function finish(){
    try { await patchDoc('stocktake/main', {status:'done', doneAt:nowISO(), doneBy:S.me.id || ''}); logDay('Opening stocktake finished'); toast('Opening stocktake finished'); } catch (e){ dbFail(e); }
  }
  function draw(force){
    if (!force && editingIn(body)) return;
    const st = S.take ? S.take.status : 'none';
    body.replaceChildren();
    if (U.msg) body.append(h('div', {class:'banner ' + (U.msg.bad ? 'bad' : 'info')}, h('p', {text:U.msg.text})));
    if (st === 'none'){
      body.append(h('div', {class:'card'}, h('h3', {}, 'Not started', chip('Awaiting opening stocktake', 'warn')),
        h('p', {text:'Count what is physically in each bay and on each rack. Nothing in Shopify changes until you review the differences and apply them one product at a time.'}),
        h('p', {class:'muted', text:'A count sets the figure. It never adds to it, so a delivery that has already been received is not counted twice.'}),
        h('div', {class:'bar'}, btn('Start the opening stocktake', start, 'pri'))));
      return;
    }
    if (st === 'done'){
      body.append(h('div', {class:'card'}, h('h3', {}, 'Finished', chip('Stock checked ' + whenText(S.take.doneAt), 'ok')),
        h('p', {text:Object.keys(S.take.applied || {}).length + ' products were counted and set in Shopify. Use Count on the Stock screen for any later correction.'})));
      return;
    }
    const bayPick = bayPicker('stBay', U.bay, 'Choose the bay or rack'); bayPick.addEventListener('change', e => { U.bay = e.target.value; });
    const mine = S.counts.slice().sort((a, b) => String(b.at).localeCompare(String(a.at)));
    body.append(h('div', {class:'card'}, h('h3', {}, 'Count a location', chip(mine.length + (mine.length === 1 ? ' count' : ' counts') + ' so far', 'info')),
      h('div', {class:'grid2'}, field('Bay or rack position', bayPick), field('Product or roll', finder.input)), finder.results, picked,
      h('div', {class:'bar'}, h('div', {style:'width:160px'}, qty), btn('Add this count', addCount, 'pri'))));
    body.append(h('section', {class:'sec'}, h('h2', {}, 'Counted so far'),
      listOf(mine.slice(0, 60).map(c => h('div', {class:'row static'}, bayTag(c.bay), h('div', {class:'grow'}, h('div', {class:'who', text:c.title}), h('div', {class:'sub', text:L.fmtQty(c.qty, c.unit) + ' · ' + whenText(c.at)})),
        btn('Remove', () => { U.review = null; S.cap.db.doc('counts/' + c.id).delete().catch(dbFail); }, 'sm'))), 'Nothing counted yet', 'Each count is one product in one bay. Count the same product again in another bay and the totals are added up.')));
    const rv = U.review;
    const sec = h('section', {class:'sec'}, h('h2', {}, 'Review against Shopify', h('span', {class:'grow'}), btn(U.busy ? 'Working' : rv ? 'Review again' : 'Review the differences', runReview, 'sm pri', {disabled:U.busy || !mine.length})));
    if (rv){
      sec.append(listOf(rv.rows.map(r => {
        const done = isApplied(r), held = r.m ? r.m.heldWeb + r.m.heldSupplier : 0;
        return h('div', {class:'row static'},
          h('div', {class:'grow'}, h('div', {class:'who', text:r.title}),
            h('div', {class:'sub', text:!r.found ? 'No longer in Shopify.' : 'Counted ' + L.fmtQty(r.counted, r.unit) + ' in ' + Object.keys(r.bays).join(', ') + '. Shopify shows ' + L.fmtQty(r.fig.available, r.unit) + ' free' + (r.fig.on_hand - r.fig.available ? ' and ' + L.fmtQty(r.fig.on_hand - r.fig.available, r.unit) + ' held' : '') + '.' + (held ? ' ' + L.fmtQty(held, r.unit) + ' of the count is set aside for jobs.' : '')}),
            h('div', {class:'meta'}, !r.found ? chip('Not found', 'bad') : !r.tracked ? chip('Shopify is not tracking this', 'warn') : r.plan.conflict ? chip('Fewer than promised to customers', 'bad') : done ? chip('Applied', 'ok') : r.plan.change === 0 ? chip('Matches Shopify', 'ok') : chip('Free to sell ' + (r.plan.change > 0 ? 'up ' : 'down ') + L.fmtQty(Math.abs(r.plan.change), r.unit) + ' to ' + L.fmtQty(r.plan.free, r.unit), 'warn'))),
          r.found && r.tracked && !r.plan.conflict && !done ? btn(r.plan.change === 0 ? 'Confirm' : 'Apply to Shopify', () => apply(r, r.counted), 'sm pri', {disabled:U.busy}) : null);
      }), 'No counts to review', ''));
      if (rv.uncounted.length) sec.append(h('h3', {text:'In Shopify but not counted (' + rv.uncounted.length + ')'}), listOf(rv.uncounted.slice(0, 80).map(r => h('div', {class:'row static'},
        h('div', {class:'grow'}, h('div', {class:'who', text:r.title}), h('div', {class:'sub', text:'Shopify shows ' + L.fmtQty(r.shopify, r.unit) + ' free. Count it, or confirm there is none.'})),
        btn('None on the shelf', () => apply({variantId:r.variantId, title:r.title, unit:r.unit, counted:0, bays:{}}, 0).then(() => { rv.uncounted = rv.uncounted.filter(x => x !== r); draw(true); }), 'sm', {disabled:U.busy}))), '', ''));
      const left = rv.rows.filter(r => r.found && r.tracked && !isApplied(r)).length, ackBox = h('input', {type:'checkbox', id:'stAck', checked:U.ack, onchange:e => { U.ack = e.target.checked; draw(true); }});
      sec.append(h('div', {class:'card'}, h('h3', {}, 'Finish'),
        rv.uncounted.length ? h('label', {class:'tick'}, ackBox, 'The ' + rv.uncounted.length + ' uncounted products above are right as Shopify shows them') : null,
        h('p', {class:'muted', text:left ? left + (left === 1 ? ' counted product still has' : ' counted products still have') + ' to be applied or confirmed.' : 'Every counted product is applied.'}),
        h('div', {class:'bar'}, btn('Finish the opening stocktake', finish, 'pri', {disabled:left > 0 || (rv.uncounted.length > 0 && !U.ack)}))));
    }
    body.append(sec);
  }
  return {nodes:[h('div', {class:'head'}, h('div', {}, h('h1', {text:'Opening stocktake'}), h('p', {text:'Count by location, review the differences, then set Shopify one product at a time.'}))), body], refresh:() => draw(false)};
};

/* ---------- start ---------- */
async function boot(){
  $('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) closeSheet(); });
  $('#sheet').addEventListener('focusout', () => setTimeout(() => { if (S.sheetDirty && (S.openJob || S.openDelivery) && !editingIn($('#sheet'))) redrawSheet(); }, 80));
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$('#modal').hidden) closeModal(); else if (!$('#sheet').hidden) closeSheet(); });
  $('#newSaleTop').addEventListener('click', () => saleDialog());
  $('#newMeasureTop').addEventListener('click', () => measureDialog());
  $('#store').addEventListener('click', () => { if (S.shop.state !== 'connecting') connectShop(); });
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view && VIEWS[v]) go(v); });
  go((location.hash || '').slice(1) || 'today');
  /* In the minute an update takes, the page can arrive while the helper script beside it is refused. Without the helper
     nothing on the screen works, so it is fetched again every few seconds instead of leaving a dead screen. */
  const helper = () => !!(window.claude && typeof window.claude.use === 'function');
  for (let i = 0; i < 20 && !helper(); i++){
    await new Promise(done => { const sc = document.createElement('script'); sc.src = '/shim.js?again=' + Date.now(); sc.onload = done; sc.onerror = done; document.head.append(sc); });
    if (!helper()) await new Promise(done => setTimeout(done, 3000));
  }
  const use = name => { try { return (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };
  use('assets').then(a => { S.cap.assets = a; if (a && S.openJob && !$('#sheet').hidden && !editingIn($('#sheet'))) drawSheet(); });
  const caps = await Promise.all([use('db'), use('mcp'), use('user'), use('downloads'), use('work')]);
  S.cap.db = caps[0]; S.cap.mcp = caps[1]; S.cap.user = caps[2]; S.cap.downloads = caps[3]; S.cap.work = caps[4];
  use('cmd').then(c => { S.cap.cmd = c; loadSetup(); });
  use('geo').then(g => { S.cap.geo = g; if (g) wantGeo(openJobs().map(j => (j.customer || {}).postcode)); });
  /* who is signed in, and the line to Shopify: each is tried again by itself if the server was still starting */
  const who = async left => { try { const me = await S.cap.user.me(); S.me = {id:me.id || '', name:me.name || '', role:me.role || ''}; } catch (e) { if (left > 0) setTimeout(() => who(left - 1), 3000); } };
  if (S.cap.user) await who(10);
  startDb();
  let shopTries = 0; const shopAgain = () => { if (S.shop.state === 'down' && shopTries++ < 6) setTimeout(() => connectShop().then(shopAgain), 5000); };
  connectShop().then(shopAgain);
}
boot();
})();
