<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My fitting jobs | Innovation Flooring</title>
<style>body{font:17px/1.5 system-ui;margin:auto;padding:20px;max-width:760px;background:#f5f5f5;color:#171717}h1{font-size:26px}article{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:18px 0}button,a{font:inherit}button{padding:12px;min-height:48px;border:1px solid #777;border-radius:8px;background:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.slots button[aria-pressed=true],.send{background:#a31220;color:white}.preview{padding:14px;background:#f3f3f3;white-space:pre-wrap}small{display:block;color:#555}#status{font-weight:600}.history{border-top:1px solid #ddd;margin-top:14px;padding-top:10px}nav{display:flex;flex-wrap:wrap;gap:18px;align-items:center}.send{margin-top:12px;width:100%}section{margin-top:24px;border-top:1px solid #ddd;padding-top:12px}details{margin:14px 0}summary{cursor:pointer;font-weight:650;padding:12px;background:#f5f5f5}.work-label{display:block;margin:12px 0}input:not([type=checkbox]),select,textarea{box-sizing:border-box;width:100%;min-height:44px;font:inherit;padding:8px}input[type=checkbox]{width:22px;height:22px;margin:8px;vertical-align:middle}.work-task{padding:12px 0;border-bottom:1px solid #ddd}p{overflow-wrap:anywhere}</style>
<link rel="stylesheet" href="/crew-style.css"><link rel="stylesheet" href="/after-dark.css"><body class="crew crew-diary"><header class="brand" aria-label="Innovation Flooring Direct"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">INNOVATION</span><span class="brand-sub">FLOORING DIRECT</span><span class="brand-caption">The team behind every floor</span></header><h1>My diary</h1><nav><a id="shop" href="/" hidden>Back to shop</a><button id="test" hidden>Create test for David</button><button id="esttest" hidden>Create estimator test</button><button id="refresh">Refresh</button><button id="out">Sign out</button></nav><p>Tap a job in your diary to see the details and manage the visit.</p><p id="status" role="status"></p><main id="jobs"></main>
<script src="/fitter-work.js"></script><script src="/fitter-diary.js"></script>
<script>
const status=document.getElementById('status'),jobs=document.getElementById('jobs');let busy=false;
const el=(tag,text)=>{const n=document.createElement(tag);if(text)n.textContent=text;return n;};
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'x-ifd':'1','content-type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='/login';throw Error('Please sign in.');}const d=await r.json();if(!r.ok)throw Error(d.error?.message||'Could not complete this request.');return d;}
async function load(){if(busy)return;status.textContent='Loading your appointments...';try{const d=await api('/api/appointments');fitterAccess(d.owner,d.trial);document.getElementById('shop').hidden=!d.shop;document.getElementById('test').hidden=!(d.owner&&d.testOnly);document.getElementById('esttest').hidden=!(d.owner&&d.testOnly);jobs.replaceChildren();status.textContent=d.testOnly?'Test mode: only approved test numbers can receive texts.':'';if(!d.jobs.length)jobs.append(el('p','No assigned fittings or estimator visits booked for today or a future date. Ask the shop to check your assignment and diary booking.'));
for(const j of d.jobs){const card=el('article'),title=el('h2',j.kind+' · '+j.name+' · '+j.ref),detail=el('p',j.date+' · '+j.fitter+' · '+j.address),phone=el('small','Customer: '+(j.phone||'No mobile recorded')),grid=el('div'),preview=el('p','Select an arrival slot above.'),send=el('button','Send time slot'),result=el('p');grid.className='slots';preview.className='preview';send.className='send';send.disabled=true;result.setAttribute('role','status');let choice=null,key=crypto.randomUUID(),mode='arrival';const late=el('button','Running late - send an apology');late.disabled=!j.canDelay;late.setAttribute('aria-pressed','false');late.onclick=()=>{mode=mode==='delay'?'arrival':'delay';late.setAttribute('aria-pressed',String(mode==='delay'));late.textContent=mode==='delay'?'Delay notice selected - choose a new slot':'Running late - send an apology';choice=null;send.disabled=true;preview.textContent='Select the new arrival slot above.';for(const n of grid.children)n.setAttribute('aria-pressed','false');};
const pending=j.messages.some(m=>['queued','unsure'].includes(m.state));
d.slots.forEach((slot,i)=>{const b=el('button',slot);b.setAttribute('aria-pressed','false');b.disabled=pending;late.disabled=pending||!j.canDelay;b.onclick=()=>{choice=slot;key=crypto.randomUUID();for(const n of grid.children)n.setAttribute('aria-pressed',String(n===b));preview.textContent=(mode==='delay'?j.delayPreviews:j.previews)[i];send.disabled=false;send.textContent=mode==='delay'?'Send apology and new time':j.messages.length?'Send updated time slot':'Send time slot';};grid.append(b);});
send.onclick=async()=>{if(busy||!choice)return;busy=true;late.disabled=true;send.disabled=true;for(const b of grid.children)b.disabled=true;result.textContent='Sending...';try{const r=await api('/api/appointments/send',{jobId:j.id,visitId:j.visitId,date:j.date,slot:choice,mode,key});result.textContent=r.state==='delivered'?'Delivered to the customer.':r.state==='sent'?'Sent. Accepted by the text service. Refresh to check delivery.':r.state==='unsure'?'Delivery is uncertain. Ask the shop to check; do not resend.':'Not sent. '+(r.msg?.err||'Ask the shop to check.');}catch(e){result.textContent=e.message+' Refresh to check the recorded status before trying again.';}finally{busy=false;}};
card.append(title,detail,phone,late,grid,preview,send,result);if(j.work)addFitterWork(card,j,d.shop);if(j.canSign)addSignoff(card,j);if(pending)card.append(el('p','A previous send is pending or uncertain. The shop must check it before another is sent.'));
for(const m of j.messages.slice(-6)){const p=el('div',m.state.toUpperCase()+' · '+m.byName+' · '+new Date(m.at).toLocaleString('en-GB'));p.className='history';p.append(el('small',m.body));if(m.error)p.append(el('small',m.error));card.append(p);}card.dataset.jobKey=j.id+':'+(j.visitId||'');jobs.append(card);}renderDiary(d);
}catch(e){status.textContent=e.message;}}

function addSignoff(card,j){
 const box=el('section'),ready=el('button','Ready for customer sign-off'),issue=el('button','Issue needs attention'),form=el('div');let outcome='clear';
 box.append(el('h3','Finish this visit'),ready,issue,form);card.append(box);
 function open(mode){outcome=mode;form.replaceChildren();const name=el('input'),note=el('textarea'),reason=el('input'),noSign=el('input'),agree=el('input'),canvas=el('canvas'),clear=el('button','Clear signature'),save=el('button','Save customer sign-off'),result=el('p');
 name.placeholder='Customer or representative name';name.autocomplete='name';note.placeholder='What needs attention?';reason.placeholder='Why the customer cannot sign';noSign.type=agree.type='checkbox';canvas.width=600;canvas.height=220;canvas.style.cssText='display:block;width:100%;height:180px;background:white;border:2px solid #555;touch-action:none';canvas.setAttribute('aria-label','Customer finger signature');
 const label=(text,input)=>{const l=el('label',text);l.style.display='block';l.append(input);return l;};let strokes=[],active=null;const ctx=canvas.getContext('2d');ctx.lineWidth=2;ctx.lineCap='round';
 const point=e=>{const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];};
 canvas.onpointerdown=e=>{if(noSign.checked)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);active=[point(e)];};canvas.onpointermove=e=>{if(!active)return;const a=active.at(-1),b=point(e);if(active.length>=2000)return;active.push(b);ctx.beginPath();ctx.moveTo(a[0]*600,a[1]*220);ctx.lineTo(b[0]*600,b[1]*220);ctx.stroke();};const end=()=>{if(active?.length>1)strokes.push(active);active=null;};canvas.onpointerup=end;canvas.onpointercancel=end;clear.onclick=()=>{strokes=[];active=null;ctx.clearRect(0,0,600,220);};noSign.onchange=()=>{if(noSign.checked)clear.onclick();};
 form.append(el('h3',mode==='issues'?'Record the issue and ask the customer to review':'Ask the customer to review their job'),el('p',j.signStatement),el('p',mode==='issues'?'My choice: there are outstanding issues as recorded below.':'My choice: the agreed work is complete and I have no outstanding issues to report today.'),label('Your name',name));if(mode==='issues')form.append(label('Outstanding issues',note));form.append(label('I have read this statement and my recorded choice is correct',agree),canvas,clear,label('Customer unavailable or declines to sign',noSign),label('Reason if no signature',reason),save,result);
 const key=crypto.randomUUID();save.onclick=async()=>{save.disabled=true;try{const r=await api('/api/appointments/signoff',{jobId:j.id,date:j.date,key,outcome,name:name.value,note:note.value,agreed:agree.checked,strokes:noSign.checked?[]:strokes,reason:noSign.checked?reason.value:''});result.textContent=r.completed?'Saved. The job is complete.':'Saved. The shop has a follow-up to deal with.';ready.disabled=issue.disabled=true;form.querySelectorAll('input,textarea,button').forEach(n=>n.disabled=true);}catch(e){result.textContent=e.message;save.disabled=false;}};
 }
 ready.onclick=()=>open('clear');issue.onclick=()=>open('issues');
}
document.getElementById('esttest').onclick=async()=>{try{await api('/api/appointments/test',{kind:'estimator'});load();}catch(e){status.textContent=e.message;}};document.getElementById('test').onclick=async()=>{try{await api('/api/appointments/test',{});load();}catch(e){status.textContent=e.message;}};document.getElementById('refresh').onclick=load;document.getElementById('out').onclick=async()=>{await api('/api/logout',{});location.href='/login';};load();
</script></html>
