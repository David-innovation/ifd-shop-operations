<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · IFD Shop Operations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap">
<style>
:root{--bg:#f2f3ef;--surface:#fff;--ink:#14181a;--muted:#566065;--line:#d3d7cf;--bad:#b0241c;--bad-bg:#fadfdb;--gold:#9a7226;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#101314;--surface:#1a1e20;--ink:#edf0ee;--muted:#9aa4a7;--line:#2d3336;--bad:#ff9f96;--bad-bg:#431a17;--gold:#d6ab5c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Barlow","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
h1{font:700 30px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}small.b{font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
p{margin:0;color:var(--muted)}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;font-size:20px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:50px;width:100%}
button{font:inherit;font-weight:600;border-radius:8px;min-height:50px;padding:10px 14px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--surface)}
button.link{background:none;border:0;color:var(--ink);text-decoration:underline;min-height:40px}button[disabled]{opacity:.5}
.err{background:var(--bad-bg);color:var(--bad);border:1.5px solid var(--bad);border-radius:8px;padding:10px 12px}[hidden]{display:none!important}:focus-visible{outline:3px solid #1b5683;outline-offset:2px}
</style></head><body><main>
<div><small class="b">Innovation Flooring Direct</small><h1>Shop Operations</h1></div>
<form id="f1"><p>Enter your mobile number and we will text you a code.</p>
  <label>Mobile number<input id="mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="07700 900123" required></label><br><button id="b1" type="submit">Text me a code</button></form>
<form id="f2" hidden><p id="sent"></p>
  <label>Code from the text<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits" required></label><br><button id="b2" type="submit">Sign in</button>
  <button class="link" id="again" type="button">Use a different number</button></form>
<div class="err" id="err" hidden role="alert"></div>
</main><script>
(function(){
  const $ = s => document.querySelector(s), err = $('#err'); let mobile = '';
  const fitterLogin=['/fitter','/appointments'].includes(location.pathname);
  if(fitterLogin){document.querySelector('h1').textContent='Fitter sign-in';document.title='Fitter sign-in | Innovation Flooring';}
  const say = t => { err.textContent = t || ''; err.hidden = !t; };
  async function post(url, body){ if(fitterLogin)body.mode='fitter';const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json', 'x-ifd':'1'}, body:JSON.stringify(body), credentials:'same-origin'}); const d = await r.json().catch(() => ({})); if (!r.ok) throw (d.error || {message:'Something went wrong. Try again.'}); return d; }
  $('#f1').addEventListener('submit', async e => { e.preventDefault(); say(''); $('#b1').disabled = true;
    try { mobile = $('#mobile').value; await post('/api/login/code', {mobile:mobile}); $('#sent').textContent = 'If ' + mobile + ' is set up for this system, a code is on its way. It lasts 10 minutes.'; $('#f1').hidden = true; $('#f2').hidden = false; $('#code').focus(); }
    catch (x){ say(x.message); } $('#b1').disabled = false; });
  $('#f2').addEventListener('submit', async e => { e.preventDefault(); say(''); $('#b2').disabled = true;
    try { await post('/api/login/verify', {mobile:mobile, code:$('#code').value}); location.href = fitterLogin ? '/appointments' : '/'; } catch (x){ say(x.message); $('#b2').disabled = false; } });
  $('#again').addEventListener('click', () => { say(''); $('#f2').hidden = true; $('#f1').hidden = false; $('#code').value = ''; $('#mobile').focus(); });
})();
</script></body></html>
