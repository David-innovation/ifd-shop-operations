<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Measure approvals · Floor Pilot</title><style>body{background:#101114;color:white;font:16px system-ui;margin:0}main{max-width:900px;margin:auto;padding:24px}article{background:#202126;border:1px solid #555;border-left:4px solid #e51c43;border-radius:12px;padding:20px;margin:20px 0}p{line-height:1.6}a{color:#ffd2d8}button,textarea{font:inherit;border-radius:8px;padding:12px;margin:8px 8px 8px 0;box-sizing:border-box}button{background:#c71036;color:white;border:0;cursor:pointer}textarea{display:block;width:100%}#message{color:#ffcf75}.pending{color:#ffcf75}</style><main><a href="/#today">← Dashboard</a><h1>Measure approvals</h1><p>One-area jobs more than 20 road miles from the shop require David’s approval before a measure is booked. The £40 shop travel charge applies if the job proceeds. Multi-area jobs are outside this rule.</p><p id="message" role="status"></p><div id="rows"></div></main><script>
const el=(t,s)=>{const n=document.createElement(t);n.textContent=s;return n;},cash=n=>'£'+Number(n||0).toFixed(2);
async function load(){try{const res=await fetch('/api/measure-travel'),d=await res.json();if(!res.ok)throw Error(d.error?.message||'Cannot load');const host=document.querySelector('#rows');host.replaceChildren();for(const r of d.rows.sort((a,b)=>(a.review.state==='pending'?-1:1)-(b.review.state==='pending'?-1:1))){const c=r.check,v=r.review,card=el('article','');card.append(el('h2',(r.test?'PRACTICE · ':'')+r.customer.name+' · '+r.ref),el('strong',v.state.toUpperCase()),el('p',[r.customer.address,r.customer.postcode,r.customer.phone].filter(Boolean).join(' · ')),el('p',c.roadMiles+' road miles each way · One area · '+c.roughSizes),el('p','Materials and shop services: '+cash(c.shopEstimate)+' · Fitting: '+cash(c.fitterEstimate)+' · Additional fitter travel: '+cash(c.fitterTravel)+' · Shop distance travel: £40.00'),el('h3','Estimated full cost discussed: '+cash(Number(c.shopEstimate)+Number(c.fitterEstimate)+Number(c.fitterTravel)+40)),el('p','Customer has been told this estimate, subject to measuring.'));for(const visit of Object.values(v.requestedVisits||{}))card.append(el('p','Requested visit: '+visit.date+' · '+visit.who+' — not booked while awaiting approval.'));if(v.reason)card.append(el('p','Decision: '+v.reason));if(v.state==='pending'&&d.owner){const note=document.createElement('textarea');note.placeholder='Reason for approving or declining';card.append(note);for(const action of ['approve','decline']){const button=el('button',action==='approve'?'Approve request':'Decline request');button.onclick=async()=>{button.disabled=true;try{const response=await fetch('/api/measure-travel',{method:'POST',headers:{'content-type':'application/json','x-ifd':'1'},body:JSON.stringify({id:r.id,action,reason:note.value})});const result=await response.json();if(!response.ok)throw Error(result.error?.message||'Could not save');document.querySelector('#message').textContent=action==='approve'?'Approved. Open the job and book the measure using the estimator diary.':'Request declined. No measure booked.';await load();}catch(e){document.querySelector('#message').textContent=e.message;}finally{button.disabled=false;}};card.append(button);}}else if(v.state==='pending')card.append(el('p','Waiting for David. Staff cannot approve this request or book the measure.'));const link=el('a','Open job');link.href='/?job='+encodeURIComponent(r.id)+'#jobs';card.append(link);host.append(card);}if(!d.rows.length)host.append(el('p','No distant single-area requests yet.'));}catch(e){document.querySelector('#message').textContent=e.message;}}load();
</script></html>
