<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner’s Overview · Floor Pilot</title><style>
body{margin:0;background:#101114;color:#f8f8fa;font:16px system-ui}main{max-width:1150px;margin:auto;padding:28px}a{color:#ffc7ce}h1{margin-bottom:8px}p{line-height:1.6;color:#c4c5ce}.tiles{display:flex;gap:16px;flex-wrap:wrap}.tile,article{background:#1c1d23;border:1px solid #393941;border-radius:14px;padding:20px;margin:16px 0}.tile{flex:1;min-width:200px;border-top:3px solid #e51c43}.tile strong{display:block;font-size:28px;margin-top:8px}label{display:block;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #666;background:#25262d;color:white;box-sizing:border-box}input{max-width:100%}button{background:#be1334;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #414148;padding:12px 8px}small{color:#e8c279}.scroll{overflow:auto}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fields input{width:100%}summary{padding:12px;cursor:pointer}#message{color:#ffcf75}</style>
<main><a href="/">← Floor Pilot</a><h1>Owner’s Overview</h1><p>Private to your owner account · Materials, preparation and fitting arrangement income.</p><nav><a href="/#supplierRanges">Supplier prices</a> · <a href="/goods-in-office">Stock costs & value</a> · <a href="/buying-report">Roll & pallet savings</a></nav><label>Month <input type="month" id="month"></label><label>Find a job <input id="search" type="search" placeholder="Customer or reference"></label><p id="message" role="status"></p><div id="summary" class="tiles"></div><p id="basis"></p><p id="prep"></p><section id="rates"></section><section id="practice"></section><section id="fitters"></section><div id="jobs"></div></main>
<script>
const $=s=>document.querySelector(s),cash=n=>n==null?'Pending':'£'+Number(n).toFixed(2),labels={materials:'Flooring & accessories',prep:'Preparation materials & labour',arrangement:'Fitting arrangement & support',delivery:'Delivery'};let data;
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
async function load(){try{const r=await fetch('/api/owner-overview?month='+$('#month').value);data=await r.json();if(!r.ok)throw Error(data.error?.message||'Could not load');draw();}catch(e){$('#message').textContent=e.message;}}
function drawPractice(){const host=$('#practice');host.replaceChildren();const x=data.practiceExample;if(!x)return;const card=el('article','');card.style.borderColor='#b69b61';card.append(el('h2','Practice example — excluded from real totals'));const d=el('details','');d.open=location.hash==='#practice';d.append(el('summary','Show example for '+x.customer+' · '+x.ref),el('p',x.note));const scroll=el('div','');scroll.className='scroll';const table=el('table',''),head=el('tr','');for(const v of ['Item','Customer price','Income ex VAT','Example cost ex VAT','Example contribution'])head.append(el('th',v));table.append(head);for(const row of x.rows){const tr=el('tr','');for(const v of [row.label,cash(row.gross),cash(row.net),cash(row.cost),cash(row.contribution)])tr.append(el('td',v));table.append(tr);}scroll.append(table);d.append(scroll);for(const row of x.rows)d.append(el('p',row.label+': '+row.note));d.append(el('h3','Example shop contribution: '+cash(x.contribution)),el('p','Customer total: '+cash(x.customerTotal)+' · Paid to shop: '+cash(x.shopGross)+' · Paid directly to fitter: '+cash(x.fitter.direct)),el('h3','What the fitter earns in this example: '+cash(x.fitter.total)),el('p',x.fitter.note));card.append(d);host.append(card);}
function draw(){drawRates();drawPractice();const s=$('#summary');s.replaceChildren();for(const [label,value] of [['Calculated contribution',cash(data.confirmedProfit)],['Jobs awaiting costs',data.pending],['Arrangement income, ex VAT',cash(data.arrangementNet)]]){const d=el('div',label);d.className='tile';d.append(el('strong',value));s.append(d);}$('#basis').textContent=data.basis;$('#prep').textContent=data.prepStatus;const fit=$('#fitters');fit.replaceChildren(el('h2','Fitter Earnings'),el('p','Agreed fitting amounts only, separate from shop income. Completed work is not proof of payment. A snag return does not count the same job twice. Monthly figures use completion dates for completed jobs and diary dates for booked work.'));for(const f of data.fitters){const card=el('article','');card.append(el('h3',f.name),el('p','Completed: '+cash(f.completed)+' · Booked: '+cash(f.booked)+' · Held on incomplete work: '+cash(f.held)));const detail=el('details','');detail.append(el('summary','View '+f.jobs.length+' jobs'));for(const j of f.jobs)detail.append(el('p',j.ref+' · '+j.customer+' · '+String(j.date).slice(0,10)+' · '+cash(j.amount)+' · '+j.status+' · '+j.payment));card.append(detail);fit.append(card);}if(!data.fitters.length)fit.append(el('p','No real fitting jobs for this period.'));const host=$('#jobs');host.replaceChildren();const term=$('#search').value.toLowerCase();for(const r of data.rows.filter(r=>(r.ref+' '+r.customer).toLowerCase().includes(term))){const card=el('article','');card.append(el('h2',r.customer+' · '+r.ref),el('small',r.status),el('p','Job contribution: '+cash(r.profit)+' · Fitter payment excluded: '+cash(r.fitter)));const scroll=el('div','');scroll.className='scroll';const table=el('table','');const head=el('tr','');for(const v of ['Category','Customer price','Income ex VAT','Cost ex VAT','Contribution'])head.append(el('th',v));table.append(head);for(const c of r.categories){const tr=el('tr','');for(const v of [labels[c.key],cash(c.gross),cash(c.net),cash(c.cost),cash(c.profit)])tr.append(el('td',v));table.append(tr);}scroll.append(table);card.append(scroll);if(r.materialEstimates.length){const est=el('details','');est.append(el('summary','Automatic material costs'));for(const x of r.materialEstimates){est.append(el('p',x.name+' · '+x.quantity+' '+x.unit+' · '+cash(x.amount)+' · '+x.basis));if(x.amount==null){const input=document.createElement('input');input.type='number';input.min=0;input.step='0.01';input.placeholder='Cost ex VAT per '+(x.unit==='m'?'m²':x.unit);const button=el('button','Save cost for future jobs');button.onclick=()=>saveRate({kind:'item',id:r.id,key:x.key,amount:input.value});est.append(input,button);}}card.append(est);}if(r.costAllocationPending)card.append(el('p','Waiting for the job material list to match the quote. Missing items will not be treated as free.'));const details=el('details','');details.append(el('summary','Exceptional job cost override'));details.append(el('p','Enter the total actual costs allocated to this job, excluding recoverable VAT. Include prep materials and any prep labour paid by the shop. Use zero only when there is genuinely no direct cost.'));const fields=el('div','');fields.className='fields';const inputs={};for(const c of r.categories){const label=el('label',labels[c.key]);const input=document.createElement('input');input.type='number';input.min='0';input.step='0.01';input.value=c.cost==null?'':c.cost;input.placeholder='Awaiting confirmation';inputs[c.key]=input;label.append(input);fields.append(label);}details.append(fields);const reason=document.createElement('input');reason.placeholder='Supplier invoice / costing reference';reason.value=r.reason;details.append(reason);const pc=document.createElement('input');pc.type='checkbox';const lab=el('label','Prep material and labour costs are confirmed ');lab.prepend(pc);details.append(lab);const save=el('button','Save confirmed costs');save.onclick=async()=>{save.disabled=true;try{const response=await fetch('/api/owner-overview',{method:'POST',headers:{'content-type':'application/json','x-ifd':'1'},body:JSON.stringify({id:r.id,fingerprint:r.fingerprint,costs:Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value])),reason:reason.value,prepConfirmed:pc.checked})});const out=await response.json();if(!response.ok)throw Error(out.error?.message||'Could not save');$('#message').textContent='Confirmed costs saved. Previous entries remain in the history.';await load();}catch(e){$('#message').textContent=e.message;}finally{save.disabled=false;}};details.append(save);if(r.history.length){const history=el('details','');history.append(el('summary','Previous cost confirmations ('+r.history.length+')'));for(const h of r.history)history.append(el('p',h.at+' · '+h.reason+' · '+Object.entries(h.costs).map(([k,v])=>labels[k]+': '+cash(v)).join(' · ')));details.append(history);}card.append(details);host.append(card);}if(!host.children.length)host.append(el('p','No matching jobs. Practice jobs are excluded.'));}
async function saveRate(body){try{const response=await fetch('/api/owner-overview',{method:'POST',headers:{'content-type':'application/json','x-ifd':'1'},body:JSON.stringify({action:'rates',...body})});const out=await response.json();if(!response.ok)throw Error(out.error?.message||'Could not save');$('#message').textContent='Cost saved. Open jobs now recalculate automatically.';await load();}catch(e){$('#message').textContent=e.message;}}
function drawRates(){const host=$('#rates');host.replaceChildren();const d=el('details','');d.append(el('summary','Reusable preparation and delivery costs — owner only'),el('p','Enter confirmed buying costs excluding VAT once. These apply automatically to open jobs. Leave preparation blank until supplier prices and fitter labour are confirmed.'));for(const kind of ['delivery','plywood','screed']){const row=el('div','');row.append(el('h3',kind==='delivery'?'Delivery cost per job':kind+' preparation costs per m²'));const inputs={};for(const field of kind==='delivery'?['amount']:['material','labour']){const lab=el('label',field==='amount'?'Actual delivery cost':field==='material'?'Material cost per m²':'Labour paid by shop per m²');const input=document.createElement('input');input.type='number';input.min=0;input.step='0.01';input.value=(kind==='delivery'?data.costRates?.delivery:data.costRates?.[kind]?.[field])??'';input.placeholder='Not confirmed';inputs[field]=input;lab.append(input);row.append(lab);}const button=el('button','Save confirmed costs');button.onclick=()=>saveRate({kind,...Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value]))});row.append(button);d.append(row);}host.append(d);}
setInterval(()=>{if(document.visibilityState==='visible'&&!document.querySelector('details[open]')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))load();},30000);
$('#month').onchange=load;$('#search').oninput=()=>data&&draw();load();
</script></html>
