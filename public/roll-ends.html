<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roll ends | Floor Pilot</title><style>body{margin:0;background:#0c0d10;color:white;font:17px/1.5 system-ui}header,main{max-width:900px;margin:auto;padding:22px}a{color:white}section{background:#191b20;border:1px solid #b82c43;border-radius:14px;padding:22px;margin:18px 0}input,select,button{font:inherit;padding:14px;border:1px solid #666;border-radius:8px;box-sizing:border-box}input,select{display:block;width:100%;margin:8px 0 18px;background:#101114;color:white}button{background:#b81734;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}label{font-weight:bold}.code{font-size:32px;letter-spacing:2px}#message{white-space:pre-wrap}small{color:#bbb}[hidden]{display:none!important}@media print{body{background:white;color:black}header,#form,#searchbox,#message,button,.help{display:none!important}section{break-inside:avoid;background:white;color:black;border:2px solid black}small{color:black}section:not(.printing){display:none}}</style><header><b>FLOOR PILOT</b> · <a href="/#stock">Back to stock</a></header><main><h1>Roll ends</h1><p class="help">Give the remaining carpet or vinyl a unique code. Keep the same stock record and write the code on the roll.</p><p id="message" role="status"></p><section id="form" hidden><h2>Mark this roll end</h2><p id="product"></p><label>Measured remaining length (metres)<input id="length" type="number" step="0.1" min="0.1"></label><label>Where is it?<select id="bay"></select></label><p>The length must match stock and no cuts can still be reserved. This creates a label, not extra stock.</p><button id="save">Create roll-end code</button></section><label id="searchbox">Find by code, product, original roll or bay<input id="search" type="search" placeholder="For example RE-000001"></label><div id="rows"></div></main><script>
const $=x=>document.getElementById(x),node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e;},id=new URLSearchParams(location.search).get('variant');let latest=[];
async function api(path,body){const r=await fetch('/api/roll-ends'+path,body?{method:'POST',headers:{'content-type':'application/json','x-ifd':'1'},body:JSON.stringify(body)}:{}),d=await r.json();if(!r.ok)throw Error(d.error?.message||'Could not complete this action.');return d;}
function draw(){const q=$('search').value.toLowerCase();$('rows').replaceChildren();for(const r of latest.filter(r=>[r.code,r.title,r.originalRoll,r.bay].join(' ').toLowerCase().includes(q))){const card=node('section','');card.append(node('strong',r.code));card.firstChild.className='code';card.append(node('h2',r.title),node('p',r.length.toFixed(1)+' × '+r.width.toFixed(1)+' m when labelled'),node('p','Bay '+r.bay+' · '+r.location),node('p','Original roll: '+(r.originalRoll||r.originalVariant)),node('p',r.available===null?'Check current stock before selling.':r.available.toFixed(1)+' m currently free to sell · '+r.status));const print=node('button','Print label');print.onclick=()=>{document.querySelectorAll('.printing').forEach(x=>x.classList.remove('printing'));card.classList.add('printing');window.print();};card.append(print);$('rows').append(card);}if(!$('rows').children.length)$('rows').textContent='No roll ends match this search.';}
async function load(){const d=await api('');latest=d.rows;draw();$('bay').replaceChildren(node('option','Choose a bay'),...d.bays.map(b=>{const o=node('option',b);o.value=b;return o;}));$('bay').options[0].value='';}
$('search').oninput=draw;$('save').onclick=async()=>{$('save').disabled=true;$('message').textContent='Saving label…';try{const r=await api('',{variantId:id,length:Number($('length').value),bay:$('bay').value});$('message').textContent=(r.duplicate?'Already labelled: ':'Roll-end code created: ')+r.code+'. Stock quantity has not changed.';$('form').hidden=true;await load();$('search').value=r.code;draw();}catch(e){$('message').textContent=e.message;}finally{$('save').disabled=false;}};
load().then(async()=>{if(id){$('form').hidden=false;const r=await api('/inspect?variant='+encodeURIComponent(id));$('product').textContent=r.title+' · '+r.width+' m wide'+(r.originalRoll?' · original roll '+r.originalRoll:'')+'. Current free stock: '+(r.stock.reduce((n,s)=>n+s.available,0)/10).toFixed(1)+' m. Measure the remaining piece before confirming.';}}).catch(e=>$('message').textContent=e.message);
</script></html>
