<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Still to pay | Innovation</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f11;color:white;font:16px/1.6 Arial,sans-serif}header{padding:20px 5%;background:#181a1d;border-bottom:2px solid #ae1732;display:flex;gap:24px;flex-wrap:wrap}a{color:#e4c783}main{max-width:1100px;margin:auto;padding:24px}h1{margin:10px 0}p{color:#c5c8cc}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,input,select,textarea{font:inherit;padding:12px;border:1px solid #68414a;border-radius:8px;background:#22262a;color:white}button{cursor:pointer}button.primary{background:#b31b36}button:disabled{opacity:.5;cursor:wait}input,select,textarea{width:100%;margin:6px 0 14px}input[type=checkbox]{width:auto}label{display:block}.card{padding:20px;margin:14px 0;border:1px solid #66333e;border-radius:12px;background:#181c20}.due{color:#ffd599}.amounts{display:flex;gap:28px;flex-wrap:wrap}.amounts strong{font-size:24px;display:block}.small{font-size:13px}dialog{width:95%;max-width:650px;max-height:90vh;overflow:auto;background:#181c20;color:white;border:1px solid #ae1732;border-radius:14px;padding:24px}dialog::backdrop{background:#000b}pre{white-space:pre-wrap;font:15px/1.6 Arial}#error{color:#ffbfc9}#mode{color:#e4c783;letter-spacing:2px;font-weight:bold}.active{border:2px solid #e4c783}[hidden]{display:none!important}@media(max-width:600px){main{padding:16px}.amounts{gap:14px}.amounts strong{font-size:20px}}</style></head><body><header><b>INNOVATION FLOORING DIRECT</b><a href="/#today">Shop dashboard</a><a href="/trade">Trade counter</a></header><main><div class="bar"><button id="retail">Retail balances</button><button id="trade">Trade balances</button></div><p id="mode"></p><h1>Still to pay</h1><p id="description"></p><p id="notice" role="status"></p><div class="bar"><button id="refresh">Refresh balances</button><label><input id="tests" type="checkbox"> Show practice records</label></div><label>Find customer or reference<input id="search" type="search" placeholder="Customer name, invoice or job reference"></label><div id="summary" class="card"></div><div id="rows"></div></main><dialog id="detail"><div id="contents"></div><p id="error" role="alert"></p><button id="close">Close</button></dialog><script>
'use strict';let channel=new URLSearchParams(location.search).get('channel')==='trade'?'trade':'retail',rows=[],owner=false;const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n),node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
async function api(body){const r=await fetch('/api/still-to-pay'+(body?'':'?channel='+channel+'&tests='+($('tests').checked?'1':'0')),body?{method:'POST',headers:{'x-ifd':'1','content-type':'application/json'},body:JSON.stringify({...body,channel})}:{}),d=await r.json();if(!r.ok)throw Error(d.error?.message||'This action could not be completed.');return d;}
function btn(text,fn){const b=node('button',text);b.type='button';b.onclick=async()=>{b.disabled=true;$('error').textContent='';try{await fn();}catch(e){$('error').textContent=e.message;$('notice').textContent=e.message;}finally{b.disabled=false;}};return b;}
async function load(){try{const d=await api();rows=d.rows;owner=d.owner;$('mode').textContent=channel.toUpperCase()+' ACCOUNTS ONLY';$('description').textContent=channel==='trade'?'Trade invoices and trade payments only. Collection invoices are due seven days after collection.':'Balances owed to the shop only. Fitting money paid directly to the fitter is excluded. Unaccepted quotes and cancelled jobs are excluded.';$('retail').className=channel==='retail'?'active':'';$('trade').className=channel==='trade'?'active':'';render();$('notice').textContent='Balances updated. Reminder emails are sent only when staff choose to send them.';}catch(e){$('notice').textContent=e.message;}}
function render(){const q=$('search').value.toLowerCase(),filtered=rows.filter(r=>[r.customer,r.number].join(' ').toLowerCase().includes(q));$('summary').textContent=rows.length+' accounts · '+money(rows.reduce((n,r)=>n+r.balance,0))+' still to pay';$('rows').replaceChildren();for(const r of filtered){const c=node('div');c.className='card';c.append(node('h2',(r.test?'PRACTICE · ':'')+r.customer),node('p',r.number+(r.dueDate?' · Payment due '+r.dueDate:'')));const a=node('div');a.className='amounts';for(const [label,value] of [['Total',r.total],['Received',r.paid],['Still to pay',r.balance]]){const n=node('div',label);n.append(node('strong',money(value)));a.append(n);}c.append(a);const last=Object.values(r.reminders||{}).sort((a,b)=>b.at.localeCompare(a.at))[0];if(last)c.append(node('p','Last reminder: '+last.status+' · '+new Date(last.at).toLocaleString('en-GB')));const bar=node('div');bar.className='bar';bar.append(btn('Record payment',()=>payment(r)),btn('Preview payment reminder',()=>reminder(r)),btn('Payment / reminder history',()=>history(r)));c.append(bar);$('rows').append(c);}if(!filtered.length)$('rows').append(node('p','No outstanding balances match this view.'));}
function open(title){$('contents').replaceChildren(node('h2',title));$('error').textContent='';if(!$('detail').open)$('detail').showModal();}
function field(label,type,value){const lab=node('label',label),input=node(type==='select'?'select':'input');if(type!=='select')input.type=type;input.setAttribute('aria-label',label);if(value!==undefined)input.value=value;lab.append(input);$('contents').append(lab);return input;}
function payment(r){open('Record payment · '+r.number);$('contents').append(node('p','Still to pay: '+money(r.balance)+'. Record only money already received. This does not charge a card or move money.'));const amount=field('Amount received','number',r.balance);amount.min='.01';amount.max=r.balance;amount.step='.01';const method=field('Payment method','select');for(const m of ['bank transfer','card','cash']){const o=node('option',m);o.value=m;method.append(o);}const ref=field('Payment reference / receipt','text');const key=crypto.randomUUID();$('contents').append(btn('Save payment',async()=>{if(!ref.value.trim())throw Error('Enter a payment reference or receipt.');await api({action:'pay',id:r.id,key,amount:Number(amount.value),method:method.value,reference:ref.value});$('detail').close();await load();}));}
async function reminder(r){open('Payment reminder preview');const p=await api({action:'preview',id:r.id});$('contents').append(node('p','To: '+(p.to||'No email saved')),node('h3',p.subject),node('pre',p.body));const b=btn('Send payment reminder',async()=>{const result=await api({action:'send',id:r.id,signature:p.signature});$('detail').close();await load();$('notice').textContent=result.duplicate?'A reminder was already sent today; no duplicate was sent.':'Payment reminder accepted by the email service.';});b.disabled=!p.to;$('contents').append(b,node('p','The current balance is checked again before sending. At most one successful reminder per account per day.'));}
function history(r){open('Account history · '+r.number);for(const p of r.payments||[]){$('contents').append(node('p',money(p.amount)+' · '+p.method+' · '+(p.reference||p.note||'')+' · '+new Date(p.at).toLocaleString('en-GB')+(p.void?' · STRUCK OUT':'')));if(!p.void){const reason=field('Reason to correct '+p.key,'text');$('contents').append(btn('Strike out this payment',async()=>{await api({action:'void',id:r.id,key:p.key,reason:reason.value});$('detail').close();await load();}));}}for(const [key,m] of Object.entries(r.reminders||{})){$('contents').append(node('p',new Date(m.at).toLocaleString('en-GB')+' · Reminder '+m.status+' · '+money(m.balance)));if(owner&&['sending','unknown'].includes(m.status)){const evidence=field('Mailbox check evidence '+key,'text');for(const result of ['sent','not-sent'])$('contents').append(btn('Confirmed '+result,async()=>{await api({action:'resolve',id:r.id,key,result,reason:evidence.value});$('detail').close();await load();}));}}}
$('close').onclick=()=>$('detail').close();$('retail').onclick=()=>{channel='retail';historyReplace();load();};$('trade').onclick=()=>{channel='trade';historyReplace();load();};function historyReplace(){window.history.replaceState(null,'','/still-to-pay?channel='+channel);}$('refresh').onclick=load;$('tests').onchange=load;$('search').oninput=render;load();
</script></body></html>
