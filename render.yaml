# Render blueprint: one web service with a small disk for the records and pictures.
# Secrets are typed into Render by the owner. They are never stored in this repository.
services:
  - type: web
    name: ifd-shop-operations
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "echo no build step"
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: ifd-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATA_DIR
        value: /var/data
      - key: SHOPIFY_STORE
        value: innovationflooring
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_MOBILE
        sync: false
      - key: SHOP_MOBILE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # customer emails: the shop's own mailbox, or any mail service, over SMTP
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: SESSION_PEPPER
        generateValue: true
