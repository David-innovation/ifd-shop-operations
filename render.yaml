# Render blueprint: one web service with a small disk for the records and pictures.
# Secrets are typed into Render by the owner. They are never stored in this repository.
services:
  - type: web
    name: ifd-shop-operations
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "echo no build step"
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: ifd-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATA_DIR
        value: /var/data
      - key: SHOPIFY_STORE
        value: innovationflooring
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_MOBILE
        sync: false
      - key: SHOP_MOBILE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Customer emails go out through the shop's help@ mailbox at Google, signed in as help@ itself.
      # None of these is secret. The one secret, SMTP_PASS (an app password made in the help@ Google account),
      # is typed into Render by the owner and is never stored here.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: help@innovationflooringdirect.com
      - key: EMAIL_FROM
        value: "Innovation Flooring Direct <help@innovationflooringdirect.com>"
      - key: EMAIL_REPLY_TO
        value: help@innovationflooringdirect.com
      - key: SMTP_PASS
        sync: false
      - key: SESSION_PEPPER
        generateValue: true
