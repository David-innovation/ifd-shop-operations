# Render blueprint: one web service with a small disk for the records and pictures.
# Secrets are typed into Render by the owner. They are never stored in this repository.
services:
  - type: web
    name: ifd-shop-operations
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "echo no build step"
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: ifd-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATA_DIR
        value: /var/data
      - key: SHOPIFY_STORE
        value: innovationflooring
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_MOBILE
        sync: false
      - key: SHOP_MOBILE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Authenticate with the staff mailbox; sales@ is its verified domain alias.
      # SMTP_PASS must be supplied privately in Render, never in source control.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: admin@innovationflooringdirect.com
      - key: EMAIL_FROM
        value: "Innovation Flooring Direct <sales@innovationflooringdirect.com>"
      - key: EMAIL_REPLY_TO
        value: sales@innovationflooringdirect.com
      - key: SMTP_PASS
        sync: false
      - key: SESSION_PEPPER
        generateValue: true
